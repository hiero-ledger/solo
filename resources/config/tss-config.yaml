#schemaVersion: 1
tss:
  messageSizeSoftLimitBytes: 4194304 # 4 MiB
  messageSizeHardLimitBytes: 37748736 # 36 MiB — accommodates ~30 MiB genesis WRAPS proof
  timeoutAfterReadySeconds: 10
  readyMaxAttempts: 60
  readyBackoffSeconds: 3
  wraps:
    # These MUST stay in step with the WrapsSchema constructor defaults
    # (src/data/schema/model/solo/wraps-schema.ts). This file outranks those defaults at runtime, so
    # drift here silently downgrades WRAPS — which is exactly what happened while the file was inert.
    artifactsFolderName: data/keys/wraps-v1.0.0
    directoryName: wraps-v1.0.0
    allowedKeyFiles: decider_pp.bin,decider_vp.bin,nova_pp.bin,nova_vp.bin
    # IMPORTANT: libraryDownloadUrl must be kept consistent with directoryName.
    # If directoryName is updated, update libraryDownloadUrl to match.
    libraryDownloadUrl: https://builds.hedera.com/tss/hiero/wraps/v1.0/wraps-v1.0.0.tar.gz
