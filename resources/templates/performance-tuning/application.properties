# Opt-in overlay for the E2E performance test suite only (ONE_SHOT_PERFORMANCE_TUNING=true).
# Layered on top of the small-memory profile's application.properties; does not change any
# heap/thread setting, so it carries no additional memory cost against the CI memory gate.
#
# small-memory already lowers blockStream.blockPeriod from the platform default of 2s to
# 200ms. A block only closes at a round boundary once its period has elapsed, so a
# transaction waits on average half the period (and up to the full period) before its block
# closes and can be exported to the block node / mirror importer. Narrowing the period to
# 50ms lowers that average wait from ~100ms to ~25ms, directly reducing end-to-end mirror RTT.
blockStream.blockPeriod=50ms
