# JVM debug overlay for the mirror node importer, added by `--debug-mirror-node`; enforced by mirror-node-values.test.ts.
importer:
  # Solo's default importer is a GraalVM native image and ignores JAVA_TOOL_OPTIONS, so run the JVM image instead.
  # Solo pins the tag from the mirror node version.
  image:
    registry: gcr.io
    repository: mirrornode/hedera-mirror-importer
  # The JVM importer needs more memory than the native binary Solo runs by default.
  resources:
    requests:
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  # A debugger paused on a breakpoint would fail the liveness probe and restart the pod.
  livenessProbe: null
  env:
    JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
