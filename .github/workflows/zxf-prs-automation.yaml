name: "ZXF: PR Automation"

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - edited
      - ready_for_review
      - converted_to_draft
  pull_request_review:
    types:
      - submitted
      - dismissed
  pull_request_review_comment:
    types:
      - created
      - edited
      - deleted
  push:
    branches:
      - main
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

defaults:
  run:
    shell: bash

jobs:
  auto-assign-merge-queue:
    name: "Auto-Assign Merge Queue PRs"
    if: github.event_name == 'pull_request' && startsWith(github.base_ref, 'trunk-merge/')
    runs-on: hiero-solo-linux-medium
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Auto-Assign PRs to Merge Queue
        uses: step-security/auto-assign-action@9bf0ed34ed655f58718443237d3d9a4fead49f00 # v2.0.2
        with:
          repo-token: ${{ secrets.GH_ACCESS_TOKEN }}
          configuration-path: ".github/auto_assign.yaml"

  pr-automation:
    name: "PR Automation"
    runs-on: hiero-solo-linux-medium
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Automate PR Labels and Status
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GH_ACCESS_TOKEN }}
          script: |
            const { owner, repo } = context.repo;

            // Priority order: P0 is highest, P3 is lowest.
            const PRIORITY_LABELS = ['P0-🔥', 'P1-💎', 'P2-⏭️💎', 'P3-⏭️⏭️💎'];

            async function addLabelIfMissing(prNumber, label, existingLabels) {
              if (!existingLabels.includes(label)) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: prNumber, labels: [label] });
                core.info(`Added "${label}" to PR #${prNumber}`);
              }
            }

            async function removeLabelIfPresent(prNumber, label, existingLabels) {
              if (existingLabels.includes(label)) {
                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: prNumber, name: label });
                  core.info(`Removed "${label}" from PR #${prNumber}`);
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
            }

            async function convertToDraft(nodeId, prNumber) {
              try {
                await github.graphql(`
                  mutation($id: ID!) {
                    convertPullRequestToDraft(input: { pullRequestId: $id }) {
                      pullRequest { isDraft }
                    }
                  }
                `, { id: nodeId });
                core.info(`Converted PR #${prNumber} to draft`);
              } catch (error) {
                core.warning(`Failed to convert PR #${prNumber} to draft: ${error.message}`);
              }
            }

            async function checkUnresolvedThreads(prNumber) {
              const result = await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      reviewThreads(first: 100) {
                        nodes { isResolved isOutdated }
                      }
                    }
                  }
                }
              `, { owner, repo, number: prNumber });
              return result.repository.pullRequest.reviewThreads.nodes.some(
                t => !t.isResolved && !t.isOutdated
              );
            }

            async function getLinkedIssuePriority(prNumber, prBody) {
              const result = await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      closingIssuesReferences(first: 25) {
                        nodes {
                          number
                          labels(first: 10) { nodes { name } }
                        }
                      }
                    }
                  }
                }
              `, { owner, repo, number: prNumber });

              const closingIssues = result.repository.pullRequest.closingIssuesReferences.nodes;
              const closingNumbers = new Set(closingIssues.map(i => i.number));

              // Parse body for "related to #N" patterns not already covered by closing references.
              const relatedPattern = /(?:related\s+to|relates?\s+to|connected?\s+to|see\s+also)\s+#(\d+)/gi;
              const relatedNumbers = new Set();
              let bodyMatch;
              while ((bodyMatch = relatedPattern.exec(prBody ?? '')) !== null) {
                const issueNumber = parseInt(bodyMatch[1], 10);
                if (!closingNumbers.has(issueNumber)) relatedNumbers.add(issueNumber);
              }

              const foundPriorities = new Set();

              for (const issue of closingIssues) {
                for (const label of issue.labels.nodes) {
                  if (PRIORITY_LABELS.includes(label.name)) foundPriorities.add(label.name);
                }
              }

              for (const issueNumber of relatedNumbers) {
                try {
                  const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
                  for (const label of issue.labels) {
                    if (PRIORITY_LABELS.includes(label.name)) foundPriorities.add(label.name);
                  }
                } catch (error) {
                  core.warning(`Could not fetch issue #${issueNumber}: ${error.message}`);
                }
              }

              return PRIORITY_LABELS.find(p => foundPriorities.has(p)) ?? null;
            }

            async function processPR(prNumber) {
              core.startGroup(`PR #${prNumber}`);
              try {
                const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });

                if (pr.state === 'closed') {
                  core.info('Closed, skipping');
                  return;
                }

                const labels = pr.labels.map(l => l.name);
                const isOpen = !pr.draft;

                // Feature 1: Merge conflicts → add label and convert to draft.
                // pr.mergeable is null when GitHub has not yet computed mergeability; skip in that case.
                if (pr.mergeable === false) {
                  await addLabelIfMissing(prNumber, 'PR: Merge Conflicts', labels);
                  if (isOpen) await convertToDraft(pr.node_id, prNumber);
                } else if (pr.mergeable === true) {
                  await removeLabelIfPresent(prNumber, 'PR: Merge Conflicts', labels);
                }

                // Feature 2: Unresolved review threads → add or remove label.
                const hasUnresolved = await checkUnresolvedThreads(prNumber);
                if (hasUnresolved) {
                  await addLabelIfMissing(prNumber, 'PR: Unresolved Comments', labels);
                } else {
                  await removeLabelIfPresent(prNumber, 'PR: Unresolved Comments', labels);
                }

                // Feature 3: Blocked label on an open PR → convert to draft.
                if (labels.includes('Blocked') && isOpen) {
                  await convertToDraft(pr.node_id, prNumber);
                }

                // Feature 4: Linked issues → propagate highest priority label when none is set.
                const hasPriorityLabel = labels.some(l => PRIORITY_LABELS.includes(l));
                if (!hasPriorityLabel) {
                  const highestPriority = await getLinkedIssuePriority(prNumber, pr.body);
                  if (highestPriority) {
                    await addLabelIfMissing(prNumber, highestPriority, labels);
                  }
                }
              } catch (error) {
                core.error(`Error processing PR #${prNumber}: ${error.message}`);
              } finally {
                core.endGroup();
              }
            }

            const prEventNames = ['pull_request', 'pull_request_review', 'pull_request_review_comment'];
            if (prEventNames.includes(context.eventName)) {
              const prNumber = context.payload.pull_request?.number;
              if (prNumber) {
                await processPR(prNumber);
              } else {
                core.warning('Could not determine PR number from event payload');
              }
            } else {
              // push / schedule / workflow_dispatch — scan all open PRs.
              const { data: openPRs } = await github.rest.pulls.list({
                owner, repo, state: 'open', per_page: 100,
              });
              core.info(`Processing ${openPRs.length} open PRs`);
              for (const pr of openPRs) {
                await processPR(pr.number);
              }
            }
