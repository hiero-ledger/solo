# Tests the Linux install script (installers/linux/install.sh) on every supported distribution:
# the script-logic harness with a stand-in binary, then a real install of the SEA binary built in
# this run for the runner's architecture and libc, served from a local release directory over file://.
# Tracked by hiero-ledger/solo#5725.
name: 'Linux Install Script'

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'installers/linux/**'
      - 'sea/**'
      - '.github/workflows/flow-linux-install-script.yaml'

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-sea:
    name: "Build SEA (linux-${{ matrix.arch }}${{ matrix.libc == 'musl' && '-musl' || '' }})"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: hiero-solo-linux-medium
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
          - runner: hiero-solo-linux-medium
            arch: x64
            libc: musl
          - runner: ubuntu-24.04-arm
            arch: arm64
            libc: musl
    env:
      SEA_ASSET: solo-linux-${{ matrix.arch }}${{ matrix.libc == 'musl' && '-musl' || '' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.49.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        if: ${{ matrix.libc != 'musl' }}
        run: npm ci

      - name: Compile TypeScript
        if: ${{ matrix.libc != 'musl' }}
        run: npx tsc

      # Installs dependencies (npm ci on CI) and compiles before building the binary.
      - name: Build SEA Binary
        if: ${{ matrix.libc != 'musl' }}
        run: task sea:build

      - name: Build musl SEA Binary
        if: ${{ matrix.libc == 'musl' }}
        run: node sea/build-musl.ts

      - name: Upload SEA Binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.SEA_ASSET }}
          path: sea/dist/${{ env.SEA_ASSET }}
          if-no-files-found: error
          retention-days: 1

  install-script:
    name: "Install Script (${{ matrix.distro }}${{ matrix.arch == 'arm64' && ', arm64' || '' }})"
    needs: build-sea
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    env:
      SEA_ASSET: solo-linux-${{ matrix.arch || 'x64' }}
    strategy:
      fail-fast: false
      matrix:
        # Same distributions as flow-install-validation.yaml, except Alpine, which install-script-musl
        # tests. `bootstrap` adds what checkout and the script need. Rows without `arch` and `runner`
        # test x64 on ubuntu-latest.
        include:
          - distro: ubuntu
            image: ubuntu:24.04
            bootstrap: 'apt-get update && apt-get install -y git curl ca-certificates'
          - distro: debian
            image: debian:12
            bootstrap: 'apt-get update && apt-get install -y git curl ca-certificates'
          - distro: fedora
            image: fedora:44
            bootstrap: 'dnf install -y --allowerasing git curl ca-certificates tar gzip'
          - distro: rocky
            image: quay.io/rockylinux/rockylinux:9
            bootstrap: 'dnf install -y --allowerasing git curl ca-certificates tar gzip'
          - distro: alma
            image: almalinux:9
            bootstrap: 'dnf install -y --allowerasing git curl ca-certificates tar gzip'
          - distro: oraclelinux
            image: oraclelinux:9
            bootstrap: 'dnf install -y --allowerasing git curl ca-certificates tar gzip'
          - distro: opensuse
            image: opensuse/leap:16.0
            bootstrap: 'zypper --non-interactive install git curl ca-certificates tar gzip'
          # Rolling release, so the tag cannot be pinned; the accepted exception is tracked in #5957.
          - distro: arch
            image: archlinux:latest
            bootstrap: 'pacman -Syu --noconfirm --needed git curl ca-certificates'
          # arm64: the oldest glibc in this set (EL9) and Ubuntu.
          - distro: ubuntu
            image: ubuntu:24.04
            bootstrap: 'apt-get update && apt-get install -y git curl ca-certificates'
            arch: arm64
            runner: ubuntu-24.04-arm
          - distro: rocky
            image: quay.io/rockylinux/rockylinux:9
            bootstrap: 'dnf install -y --allowerasing git curl ca-certificates tar gzip'
            arch: arm64
            runner: ubuntu-24.04-arm
    container:
      # The arch row intentionally uses a floating 'latest' tag; see the comment on that row.
      image: ${{ matrix.image }} # zizmor: ignore[unpinned-images]
      # Some images declare no PATH (see flow-install-validation.yaml), so declare the standard one.
      env:
        PATH: '/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
    defaults:
      run:
        # The script under test is POSIX sh.
        shell: sh
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Bootstrap Container
        run: ${{ matrix.bootstrap }}

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Install Script Logic
        run: sh installers/linux/test-install.sh

      - name: Download SEA Binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.SEA_ASSET }}
          path: sea-binary

      - name: Stage Local Release
        run: |
          set -eu
          release_directory="${RUNNER_TEMP}/release/latest/download"
          mkdir -p "${release_directory}"
          cp "sea-binary/${SEA_ASSET}" "${release_directory}/${SEA_ASSET}"
          cd "${release_directory}"
          sha256sum "${SEA_ASSET}" >SHA256SUMS

      - name: Install SEA Binary
        run: |
          set -eu
          sh installers/linux/install.sh --base-url "file://${RUNNER_TEMP}/release" --skip-image-cache
          expected_version="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json)"
          actual_version="$("${HOME}/.solo/bin/solo" --version)"
          echo "installed: ${actual_version}"
          echo "${actual_version}" | grep -qF "${expected_version}"

  # Alpine runs through `docker run` from the runner, not as a job container: the runner cannot run
  # JavaScript actions (checkout, download-artifact) in an Alpine container on arm64.
  install-script-musl:
    name: "Install Script (alpine${{ matrix.arch == 'arm64' && ', arm64' || '' }})"
    needs: build-sea
    runs-on: ${{ matrix.runner }}
    env:
      ALPINE_IMAGE: alpine:3.21.9
      SEA_ASSET: solo-linux-${{ matrix.arch }}-musl
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download SEA Binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.SEA_ASSET }}
          path: sea-binary

      - name: Test Install Script in Alpine
        run: |
          docker run --rm --interactive \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace \
            --env SEA_ASSET \
            "${ALPINE_IMAGE}" sh -eu <<'EOF'
          apk add --no-cache curl >/dev/null
          sh installers/linux/test-install.sh

          release_directory='/tmp/release/latest/download'
          mkdir -p "${release_directory}"
          cp "sea-binary/${SEA_ASSET}" "${release_directory}/${SEA_ASSET}"
          (cd "${release_directory}" && sha256sum "${SEA_ASSET}" >SHA256SUMS)

          # A bare Alpine has neither libstdc++ nor libgcc, so the install fails and names the package.
          if sh installers/linux/install.sh --base-url 'file:///tmp/release' 2>/tmp/install.log; then
            echo 'expected the install to fail without libstdc++'
            exit 1
          fi
          cat /tmp/install.log
          grep -qF 'apk add libstdc++' /tmp/install.log

          apk add --no-cache libstdc++ >/dev/null
          sh installers/linux/install.sh --base-url 'file:///tmp/release'
          expected_version="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json)"
          actual_version="$("${HOME}/.solo/bin/solo" --version)"
          echo "installed: ${actual_version}"
          echo "${actual_version}" | grep -qF "${expected_version}"
          EOF
