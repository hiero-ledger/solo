# Builds the consensus node deterministic Docker image
# (hedera-node/infrastructure/docker/containers/production-next/consensus-node) from source,
# loads it into a Kind cluster, overrides the solo-deployment chart root image through a Helm
# values file, and deploys a Solo network with it. See hiero-ledger/solo#4169.

name: "Deterministic Image Deploy Test"

on:
  workflow_dispatch:
    inputs:
      consensus-node-version:
        description: "Consensus node tag to build the image from (leave empty for version.ts default)"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      consensus-node-version:
        description: "Consensus node tag to build the image from (leave empty for version.ts default)"
        type: string
        required: false
        default: ""
    secrets:
      SLACK_TEST_WEBHOOK:
        description: "Webhook used to post a failure notification"
        required: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  STEP_TIMEOUT_MINUTES: '5'
  CN_IMAGE_REGISTRY: localhost
  CN_IMAGE_REPOSITORY: hiero/consensus-node
  CN_IMAGE_TAG: ci
  KIND_CLUSTER_NAME: solo-cluster
  CN_DOCKER_CONTEXT: hedera-node/infrastructure/docker/containers/production-next/consensus-node

jobs:
  deterministic-image-deploy:
    name: Build CN Image and Deploy Solo Network
    runs-on: hiero-solo-linux-large
    timeout-minutes: 90
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        uses: step-security/retry@38808b4332b98bb36ca031abff0c100231608288 # v4.0.0
        with:
          max_attempts: 10
          timeout_minutes: 10
          command: npm ci

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        with:
          version: 3.49.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile Project
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        run: task build:compile

      - name: Restore Solo Bin Cache
        id: solo-bin-cache
        if: ${{ !cancelled() && !failure() }}
        uses: ./.github/actions/solo-bin-cache
        with:
          operation: restore
          key-suffix: ${{ hashFiles('version.ts') }}

      - name: Restore Solo Image Cache
        id: solo-image-cache
        if: ${{ !cancelled() && !failure() }}
        uses: ./.github/actions/solo-image-cache
        with:
          operation: restore
          key-suffix: ${{ hashFiles('version.ts', 'version-test.ts', 'resources/config/solo-cache-images-target.yaml') }}

      - name: Resolve Consensus Node Version
        id: versions
        env:
          CN_VERSION_INPUT: ${{ inputs.consensus-node-version }}
        run: |
          source .github/workflows/script/helper.sh
          DEFAULT_CN=$(extract_version HEDERA_PLATFORM_VERSION version.ts)
          CN_VERSION="${CN_VERSION_INPUT:-$DEFAULT_CN}"
          echo "cn-version=${CN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "### Consensus node version: ${CN_VERSION}" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Checkout Consensus Node
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        env:
          RESOLVED_CN_VERSION: ${{ steps.versions.outputs.cn-version }}
        run: |
          CN_REPO_DIR="${GITHUB_WORKSPACE}/../hiero-consensus-node"
          git clone https://github.com/hiero-ledger/hiero-consensus-node.git \
            --depth 1 --branch "${RESOLVED_CN_VERSION}" "$CN_REPO_DIR" 2>/dev/null || \
          git clone https://github.com/hiero-ledger/hiero-consensus-node.git \
            --depth 1 --branch "refs/tags/${RESOLVED_CN_VERSION}" "$CN_REPO_DIR"

      - name: Build Consensus Node Artifacts
        timeout-minutes: 45
        run: |
          cd "${GITHUB_WORKSPACE}/../hiero-consensus-node"
          LOG_FILE="/tmp/consensus-node-build.log"
          ./gradlew assemble --stacktrace > "$LOG_FILE" 2>&1 || {
            echo "Build failed. Last 100 lines:"
            tail -100 "$LOG_FILE"
            exit 1
          }

      - name: Build Deterministic Docker Image
        id: image
        timeout-minutes: 20
        run: |
          CN_REPO_DIR="${GITHUB_WORKSPACE}/../hiero-consensus-node"
          CONTEXT="${CN_REPO_DIR}/${CN_DOCKER_CONTEXT}"

          # Stage the Gradle artifacts the Dockerfile COPYs from sdk/
          mkdir -p "${CONTEXT}/sdk/data"
          cp -R "${CN_REPO_DIR}/hedera-node/data/lib" "${CONTEXT}/sdk/data/"
          cp -R "${CN_REPO_DIR}/hedera-node/data/apps" "${CONTEXT}/sdk/data/"

          cd "${CN_REPO_DIR}"
          printf "VERSION=%s\nCOMMIT=%s\nDATE=%s" \
            "$(./gradlew -q showVersion)" \
            "$(git log -1 --format='%H' | cut -c1-8)" \
            "$(date -u)" > "${CONTEXT}/sdk/VERSION"
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"

          IMAGE="${CN_IMAGE_REGISTRY}/${CN_IMAGE_REPOSITORY}:${CN_IMAGE_TAG}"
          DOCKER_BUILDKIT=1 docker build \
            --no-cache \
            --platform linux/amd64 \
            --build-arg "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" \
            --tag "${IMAGE}" \
            "${CONTEXT}"

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "id=$(docker image inspect --format '{{.Id}}' "${IMAGE}")" >> "$GITHUB_OUTPUT"

      - name: Create Kind Cluster and Load Image
        timeout-minutes: 15
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          # kind/kubectl/helm are not preinstalled; `solo init` installs them into ~/.solo/bin
          npm run solo -- init
          export PATH=~/.solo/bin:${PATH}
          kind create cluster -n "${KIND_CLUSTER_NAME}"
          kind load docker-image "${IMAGE}" -n "${KIND_CLUSTER_NAME}"

      - name: Generate Values Files
        id: values-file
        env:
          RESOLVED_CN_VERSION: ${{ steps.versions.outputs.cn-version }}
        run: |
          # Helm values overriding the root container image with the freshly built one.
          # Image is preloaded into Kind, so never pull.
          HELM_VALUES_FILE="/tmp/deterministic-image-helm-values.yaml"
          {
            echo "defaults:"
            echo "  root:"
            echo "    image:"
            echo "      registry: \"${CN_IMAGE_REGISTRY}\""
            echo "      repository: \"${CN_IMAGE_REPOSITORY}\""
            echo "      tag: \"${CN_IMAGE_TAG}\""
            echo "      pullPolicy: \"Never\""
          } > "$HELM_VALUES_FILE"

          VALUES_FILE="/tmp/deterministic-image-falcon-values.yaml"
          CN_REPO_DIR="${GITHUB_WORKSPACE}/../hiero-consensus-node"
          {
            echo "network:"
            echo "  --release-tag: \"${RESOLVED_CN_VERSION}\""
            echo "  --values-file: \"${HELM_VALUES_FILE}\""
            echo ""
            echo "setup:"
            echo "  --release-tag: \"${RESOLVED_CN_VERSION}\""
            echo "  --local-build-path: \"${CN_REPO_DIR}/hedera-node/data\""
          } > "$VALUES_FILE"

          echo "Helm values:"; cat "$HELM_VALUES_FILE"
          echo "Falcon values:"; cat "$VALUES_FILE"
          echo "path=$VALUES_FILE" >> "$GITHUB_OUTPUT"

      - name: Deploy Solo Network
        timeout-minutes: 40
        env:
          VALUES_FILE_PATH: ${{ steps.values-file.outputs.path }}
        run: |
          export PATH=~/.solo/bin:${PATH}
          npm run solo -- one-shot falcon deploy --values-file "${VALUES_FILE_PATH}"

      - name: Verify Network Runs the Built Image
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: |
          export PATH=~/.solo/bin:${PATH}
          kubectl --context "kind-${KIND_CLUSTER_NAME}" get pods -A -l solo.hedera.com/type=network-node \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{range .spec.containers[*]}{.image}{" "}{end}{"\n"}{end}' \
            | tee /tmp/network-node-images.txt
          if ! grep -q "${CN_IMAGE_REGISTRY}/${CN_IMAGE_REPOSITORY}:${CN_IMAGE_TAG}" /tmp/network-node-images.txt; then
            echo "::error::Network node pods are not running ${CN_IMAGE_REGISTRY}/${CN_IMAGE_REPOSITORY}:${CN_IMAGE_TAG}"
            exit 1
          fi
          echo "### Deterministic image deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Image ID: \`${IMAGE_ID}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Save Solo Bin Cache
        if: ${{ github.event_name != 'pull_request' && steps.solo-bin-cache.outputs.cache-hit != 'true' && !cancelled() && !failure() }}
        uses: ./.github/actions/solo-bin-cache
        with:
          operation: save
          key-suffix: ${{ hashFiles('version.ts') }}

      - name: Save Solo Image Cache
        if: ${{ github.event_name != 'pull_request' && steps.solo-image-cache.outputs.cache-hit != 'true' && !cancelled() && !failure() }}
        uses: ./.github/actions/solo-image-cache
        with:
          operation: save
          key-suffix: ${{ hashFiles('version.ts', 'version-test.ts', 'resources/config/solo-cache-images-target.yaml') }}

      - name: Send Slack Notification on Failure
        if: ${{ github.ref == 'refs/heads/main' && !cancelled() && failure() }}
        uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2.4.0
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_TEST_WEBHOOK }}
          SLACK_COLOR: danger
          SLACK_TITLE: Nightly Deterministic Image Deploy Failed
          SLACK_MESSAGE: |
            *Branch:* `${{ github.ref_name }}`
            *Commit:* ${{ github.sha }}

            :link: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Job Logs>
          SLACK_FOOTER: ${{ github.workflow }}

      - name: Collect Diagnostics on Failure
        if: ${{ failure() }}
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        run: |
          export PATH=~/.solo/bin:${PATH}
          npm run solo -- deployment diagnostics logs -q --dev || true

      - name: Upload Logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        with:
          name: deterministic-image-logs
          path: |
            ~/.solo/logs/*
            /tmp/consensus-node-build.log
            /tmp/network-node-images.txt
          overwrite: true
          if-no-files-found: ignore

      - name: Final Cleanup
        if: always()
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        run: |
          export PATH=~/.solo/bin:${PATH}
          npm run solo -- one-shot falcon destroy -q || true
          for cluster in $(kind get clusters 2>/dev/null); do
            kind delete cluster -n "$cluster" || true
          done
          rm -rf ~/.solo
