# Deploys a Solo network whose root container uses the released consensus node deterministic image
# (gcr.io/hedera-registry/consensus-node:<version>) instead of the solo-containers image.
# NETWORK_NODE_LIFECYCLE_MODE=consensus-node-image makes Solo load the matching root image values
# and drive the image's s6 consensus service. The solo-charts checkout provides appJarsInImage, which stops the chart
# from mounting empty data/lib and data/apps volumes over the jars baked into the image. See hiero-ledger/solo#4169.

name: "Deterministic Image Deploy Test"

on:
  workflow_dispatch:
    inputs:
      consensus-node-version:
        description: "Released consensus node version (leave empty for version.ts default)"
        type: string
        required: false
        default: ""
      solo-charts-ref:
        description: "solo-charts branch or tag providing defaults.volumeClaims.appJarsInImage"
        type: string
        required: false
        default: "feat/app-jars-in-image"
  workflow_call:
    inputs:
      consensus-node-version:
        description: "Released consensus node version (leave empty for version.ts default)"
        type: string
        required: false
        default: ""
      solo-charts-ref:
        description: "solo-charts branch or tag providing defaults.volumeClaims.appJarsInImage"
        type: string
        required: false
        default: "feat/app-jars-in-image"
    secrets:
      SLACK_TEST_WEBHOOK:
        description: "Webhook used to post a failure notification"
        required: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  STEP_TIMEOUT_MINUTES: '5'
  NETWORK_NODE_LIFECYCLE_MODE: consensus-node-image

jobs:
  deterministic-image-deploy:
    name: Deploy Solo Network with Released CN Image
    runs-on: hiero-solo-linux-large
    timeout-minutes: 60
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        uses: step-security/retry@38808b4332b98bb36ca031abff0c100231608288 # v4.0.0
        with:
          max_attempts: 10
          timeout_minutes: 10
          command: npm ci

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        with:
          version: 3.49.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile Project
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        run: task build:compile

      - name: Restore Solo Bin Cache
        id: solo-bin-cache
        if: ${{ !cancelled() && !failure() }}
        uses: ./.github/actions/solo-bin-cache
        with:
          operation: restore
          key-suffix: ${{ hashFiles('version.ts') }}

      - name: Restore Solo Image Cache
        id: solo-image-cache
        if: ${{ !cancelled() && !failure() }}
        uses: ./.github/actions/solo-image-cache
        with:
          operation: restore
          key-suffix: ${{ hashFiles('version.ts', 'version-test.ts', 'resources/config/solo-cache-images-target.yaml') }}

      - name: Resolve Consensus Node Version
        id: versions
        env:
          CN_VERSION_INPUT: ${{ inputs.consensus-node-version }}
        run: |
          source .github/workflows/script/helper.sh
          DEFAULT_CN=$(extract_version HEDERA_PLATFORM_VERSION version.ts)
          CN_VERSION="${CN_VERSION_INPUT:-$DEFAULT_CN}"
          # Image tags have no 'v' prefix; Solo release tags do
          echo "cn-version=v${CN_VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "image=gcr.io/hedera-registry/consensus-node:${CN_VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "### Consensus node image: gcr.io/hedera-registry/consensus-node:${CN_VERSION#v}" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout solo-charts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        with:
          repository: hiero-ledger/solo-charts
          ref: ${{ inputs.solo-charts-ref || 'feat/app-jars-in-image' }}
          path: solo-charts
          persist-credentials: false

      - name: Build solo-charts Dependencies
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        run: |
          # `solo init` installs helm into ~/.solo/bin
          npm run solo -- init
          export PATH=~/.solo/bin:${PATH}
          helm dependency build solo-charts/charts/solo-deployment

      - name: Generate Falcon Values File
        id: values-file
        env:
          RESOLVED_CN_VERSION: ${{ steps.versions.outputs.cn-version }}
        run: |
          VALUES_FILE="/tmp/deterministic-image-falcon-values.yaml"
          {
            echo "network:"
            echo "  --release-tag: \"${RESOLVED_CN_VERSION}\""
            echo "  --chart-dir: \"${GITHUB_WORKSPACE}/solo-charts/charts\""
            echo ""
            echo "setup:"
            echo "  --release-tag: \"${RESOLVED_CN_VERSION}\""
          } > "$VALUES_FILE"

          echo "Falcon values:"; cat "$VALUES_FILE"
          echo "path=$VALUES_FILE" >> "$GITHUB_OUTPUT"

      - name: Deploy Solo Network
        timeout-minutes: 40
        env:
          VALUES_FILE_PATH: ${{ steps.values-file.outputs.path }}
        run: |
          export PATH=~/.solo/bin:${PATH}
          npm run solo -- one-shot falcon deploy --values-file "${VALUES_FILE_PATH}"

      - name: Verify Network Runs the Released Image
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        env:
          EXPECTED_IMAGE: ${{ steps.versions.outputs.image }}
        run: |
          export PATH=~/.solo/bin:${PATH}
          kubectl --context kind-solo-cluster get pods -A -l solo.hedera.com/type=network-node \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{range .spec.containers[*]}{.image}{" "}{end}{"\n"}{end}' \
            | tee /tmp/network-node-images.txt
          if ! grep -q "${EXPECTED_IMAGE}" /tmp/network-node-images.txt; then
            echo "::error::Network node pods are not running ${EXPECTED_IMAGE}"
            exit 1
          fi
          # the jars must come from the image, not from an empty mounted volume
          JAR_COUNT=$(kubectl --context kind-solo-cluster -n one-shot exec network-node1-0 -c root-container -- \
            bash -c 'ls /opt/hgcapp/services-hedera/HapiApp2.0/data/lib/*.jar /opt/hgcapp/services-hedera/HapiApp2.0/data/apps/*.jar | wc -l')
          echo "Jar files visible in the root container: ${JAR_COUNT}"
          if [ "${JAR_COUNT}" -eq 0 ]; then
            echo "::error::No jar files in data/lib or data/apps; a volume is hiding the jars baked into the image"
            exit 1
          fi
          echo "### Released consensus node image deployed: \`${EXPECTED_IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Save Solo Bin Cache
        if: ${{ github.event_name != 'pull_request' && steps.solo-bin-cache.outputs.cache-hit != 'true' && !cancelled() && !failure() }}
        uses: ./.github/actions/solo-bin-cache
        with:
          operation: save
          key-suffix: ${{ hashFiles('version.ts') }}

      - name: Save Solo Image Cache
        if: ${{ github.event_name != 'pull_request' && steps.solo-image-cache.outputs.cache-hit != 'true' && !cancelled() && !failure() }}
        uses: ./.github/actions/solo-image-cache
        with:
          operation: save
          key-suffix: ${{ hashFiles('version.ts', 'version-test.ts', 'resources/config/solo-cache-images-target.yaml') }}

      - name: Send Slack Notification on Failure
        if: ${{ github.ref == 'refs/heads/main' && !cancelled() && failure() }}
        uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2.4.0
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_TEST_WEBHOOK }}
          SLACK_COLOR: danger
          SLACK_TITLE: Nightly Deterministic Image Deploy Failed
          SLACK_MESSAGE: |
            *Branch:* `${{ github.ref_name }}`
            *Commit:* ${{ github.sha }}

            :link: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Job Logs>
          SLACK_FOOTER: ${{ github.workflow }}

      - name: Collect Diagnostics on Failure
        if: ${{ failure() }}
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        run: |
          export PATH=~/.solo/bin:${PATH}
          npm run solo -- deployment diagnostics logs -q --dev || true

      - name: Upload Logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        with:
          name: deterministic-image-logs
          path: |
            ~/.solo/logs/*
            /tmp/network-node-images.txt
          overwrite: true
          if-no-files-found: ignore

      - name: Final Cleanup
        if: always()
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        run: |
          export PATH=~/.solo/bin:${PATH}
          npm run solo -- one-shot falcon destroy -q || true
          for cluster in $(kind get clusters 2>/dev/null); do
            kind delete cluster -n "$cluster" || true
          done
          rm -rf ~/.solo
