name: "ZXC: Check Production Overrides"
# Fails if any top-level production dependency in package-lock.json is not
# pinned to its exact locked version in the package.json overrides field.
# Called by: flow-pull-request-checks.yaml, flow-build-application.yaml

on:
  workflow_call:
    inputs:
      custom-job-label:
        description: "Custom Job Label:"
        type: string
        required: false
        default: "Check"

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  check-production-overrides:
    name: "Check Production Overrides (${{ inputs.custom-job-label }})"
    runs-on: hiero-solo-linux-medium
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"

      - name: Check production overrides are current
        run: node scripts/check-production-overrides.mjs
