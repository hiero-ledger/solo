name: "Build SEA Binaries"
# Builds a Node.js Single Executable Application (SEA) for each supported platform.
# The hello-world binary is used to prove the SEA pipeline works end-to-end before
# wiring in the full solo CLI.
#
# Each matrix leg produces one self-contained binary (no Node.js required to run it)
# and uploads it as a GitHub Actions artifact for download and smoke-testing.

on:
  workflow_dispatch:
    inputs:
      node-version:
        description: "Node.js version"
        type: string
        required: false
        default: "22"
  push:
    branches:
      - main
      - 'release/*'

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-sea:
    name: "SEA / ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: darwin
          - os: windows-latest
            platform: win32

    runs-on: ${{ matrix.os }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version || '22' }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build SEA Binary
        run: npx tsx sea/build.ts

      - name: Smoke Test Binary
        # Verify the binary runs and correctly reports isSea() = true
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "win32" ]]; then
            BIN=$(find sea/dist -name "solo-hello-win32-*.exe" | head -1)
          else
            BIN=$(find sea/dist -name "solo-hello-${{ matrix.platform }}-*" | head -1)
            chmod +x "$BIN"
          fi
          echo "Running: $BIN"
          OUTPUT=$("$BIN")
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Running as Single Executable Application: true"
          echo "✓ Smoke test passed"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solo-hello-${{ matrix.platform }}-${{ github.sha }}
          path: sea/dist/solo-hello-*
          if-no-files-found: error
          retention-days: 7
