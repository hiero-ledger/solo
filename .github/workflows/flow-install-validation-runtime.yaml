# Validates Solo's real Debian/Ubuntu container-runtime bootstrap: the Homebrew bootstrap plus
# `brew install podman`, that the resulting podman runs a container rootfully (the mode Solo uses on
# Linux), and that a kind cluster backed by that podman comes up and tears down with no residue.
#
# This job cannot live in the distribution-container matrix of flow-install-validation.yaml: podman
# and kind need a VM-class runner, which a GitHub-hosted `ubuntu-latest` runner is.
#
# Tracked by hiero-ledger/solo#4888, closes hiero-ledger/solo#4910.
name: 'Install Validation (Podman Runtime)'

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  CLUSTER_NAME: solo-install-validation

jobs:
  podman-runtime-validation:
    name: 'Install Validation (Podman Runtime)'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.49.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize System Container Configuration
        run: |
          # The GitHub-hosted ubuntu-latest image preinstalls podman 4.x along with the whole system
          # container stack it needs (/usr/bin/crun, /usr/libexec/podman/*) and a legacy v1
          # /etc/containers/registries.conf. `brew install podman` gives us podman 6.x plus its own
          # helper stack inside the brew prefix (conmon, crun, fuse-overlayfs, passt, ...), but two
          # things still send it back to the preinstalled system stack:
          #
          #   * podman 5+ refuses to load a v1 registries.conf at all ("registries.conf must be in v2
          #     format but is in v1 format").
          #   * podman resolves its OCI runtime from the absolute paths in containers.conf
          #     (/usr/bin/crun, /usr/sbin/crun, ...), never from PATH — so the brew podman runs the
          #     4.x-era system crun, which cannot parse the OCI spec version podman 6 writes and fails
          #     the container start with "OCI runtime error: crun: unknown version specified".
          #
          # Solo does not write either of these files: it installs podman through Homebrew and leaves
          # the system container configuration untouched, so a user whose machine already carries an
          # older system container stack hits exactly the same mismatch. This step is the CI
          # environment standing in for that gap in the product, and it is worth its own issue.
          #
          # Rootful podman reads these system files whichever binary is invoked, so this one step
          # covers both the rootful `podman run` in the validation harness below and the rootful `kind
          # create cluster` later in this job — and that kind step passes a short image name
          # (kindest/node:...), which only resolves via unqualified-search-registries.
          #
          # Homebrew ships no netavark/aardvark-dns, so helper_binaries_dir keeps the system helper
          # directories after the brew prefix. The brew binaries below do not exist yet — the brew
          # bootstrap runs in the next step — which is why the diagnostics only report on them.
          BREW_PREFIX='/home/linuxbrew/.linuxbrew'

          for BINARY in /usr/bin/crun "${BREW_PREFIX}/bin/crun" "${BREW_PREFIX}/bin/conmon"; do
            if [[ -x "${BINARY}" ]]; then
              echo "${BINARY}: $("${BINARY}" --version 2> /dev/null | head -n 1)"
            else
              echo "${BINARY}: not present"
            fi
          done

          for CONFIGURATION in /etc/containers/registries.conf /etc/containers/containers.conf; do
            if [[ -f "${CONFIGURATION}" ]]; then
              echo "Existing ${CONFIGURATION}:"
              cat "${CONFIGURATION}"
            else
              echo "No existing ${CONFIGURATION}"
            fi
          done

          sudo mkdir -p /etc/containers
          printf 'unqualified-search-registries = ["docker.io"]\n' |
            sudo tee /etc/containers/registries.conf > /dev/null

          sudo tee /etc/containers/containers.conf > /dev/null << EOF
          [engine]
          runtime = "crun"
          conmon_path = ["${BREW_PREFIX}/bin/conmon"]
          helper_binaries_dir = ["${BREW_PREFIX}/bin", "/usr/libexec/podman", "/usr/lib/podman"]

          [engine.runtimes]
          crun = ["${BREW_PREFIX}/bin/crun"]
          EOF

      - name: Validate Homebrew Podman Install
        env:
          SOLO_PODMAN_RUNTIME_VALIDATION: 'true'
        run: task test-podman-runtime-validation

      - name: Resolve Pinned Versions and Podman Path
        id: runtime
        run: |
          # kind's version and node image are read from the repo so this job cannot drift from the
          # versions Solo actually pins.
          source .github/workflows/script/helper.sh
          echo "kind-version=$(extract_version KIND_VERSION version.ts)" >> "$GITHUB_OUTPUT"
          echo "kind-node-image=$(extract_version KIND_NODE_IMAGE src/core/constants.ts)" >> "$GITHUB_OUTPUT"

          # BrewPackageManager installs into this fixed prefix. Prefer it over any distribution
          # podman, which is too old for kind; the PATH the previous step's brew bootstrap set lives
          # in that test process only, not in this shell.
          PODMAN_DIRECTORY="/home/linuxbrew/.linuxbrew/bin"
          if [[ ! -x "${PODMAN_DIRECTORY}/podman" ]]; then
            PODMAN_DIRECTORY="$(dirname "$(command -v podman)")"
          fi
          echo "podman-directory=${PODMAN_DIRECTORY}" >> "$GITHUB_OUTPUT"
          "${PODMAN_DIRECTORY}/podman" --version

      - name: Setup Kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          # install_only keeps this to the kind binary — the cluster below is created with the
          # podman provider, not the runner's docker daemon.
          install_only: true
          version: ${{ steps.runtime.outputs.kind-version }}

      - name: Create Kind Cluster With Podman
        env:
          PODMAN_DIRECTORY: ${{ steps.runtime.outputs.podman-directory }}
          KIND_NODE_IMAGE: ${{ steps.runtime.outputs.kind-node-image }}
        run: |
          RUNTIME_PATH="${PODMAN_DIRECTORY}:$(dirname "$(command -v kind)"):${PATH}"

          # Same invocation shape as ClusterTaskManager: kind runs rootfully (PodmanMode.ROOTFUL on
          # Linux) and sudo resets the PATH, so podman and kind are passed through `sudo env`.
          sudo env KIND_EXPERIMENTAL_PROVIDER=podman "PATH=${RUNTIME_PATH}" \
            kind create cluster --name "${CLUSTER_NAME}" --image "${KIND_NODE_IMAGE}"

          if ! sudo env KIND_EXPERIMENTAL_PROVIDER=podman "PATH=${RUNTIME_PATH}" kind get clusters |
            grep -qx "${CLUSTER_NAME}"; then
            echo "::error::kind did not report cluster ${CLUSTER_NAME} after creation"
            exit 1
          fi

          if ! sudo env "PATH=${RUNTIME_PATH}" podman ps --filter "name=${CLUSTER_NAME}-control-plane" \
            --format '{{.Names}}' | grep -qx "${CLUSTER_NAME}-control-plane"; then
            echo "::error::podman has no running node container for cluster ${CLUSTER_NAME}"
            exit 1
          fi

      - name: Delete Kind Cluster And Assert No Residue
        if: always()
        env:
          PODMAN_DIRECTORY: ${{ steps.runtime.outputs.podman-directory }}
        run: |
          KIND_PATH="$(command -v kind || true)"
          if [[ -z "${PODMAN_DIRECTORY}" || -z "${KIND_PATH}" ]]; then
            echo "Podman or kind was never resolved, so no cluster was created — nothing to clean up."
            exit 0
          fi
          RUNTIME_PATH="${PODMAN_DIRECTORY}:$(dirname "${KIND_PATH}"):${PATH}"

          sudo env KIND_EXPERIMENTAL_PROVIDER=podman "PATH=${RUNTIME_PATH}" \
            kind delete cluster --name "${CLUSTER_NAME}"

          if sudo env KIND_EXPERIMENTAL_PROVIDER=podman "PATH=${RUNTIME_PATH}" kind get clusters |
            grep -qx "${CLUSTER_NAME}"; then
            echo "::error::kind still lists cluster ${CLUSTER_NAME} after deletion"
            exit 1
          fi

          RESIDUAL_CONTAINERS="$(sudo env "PATH=${RUNTIME_PATH}" podman ps -a \
            --filter "name=${CLUSTER_NAME}" --format '{{.Names}}')"
          if [[ -n "${RESIDUAL_CONTAINERS}" ]]; then
            echo "::error::podman left containers behind after deletion: ${RESIDUAL_CONTAINERS}"
            exit 1
          fi
