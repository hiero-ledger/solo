name: "Sync Production Overrides"
# Regenerates the supply-chain pin overrides in package.json whenever
# package-lock.json changes (e.g. after a Dependabot dependency update).
# If the overrides are stale the job commits the refreshed package.json
# back to the branch that triggered the run.

on:
  push:
    branches:
      - main
      - 'release/*'
      - 'dependabot/**'
    paths:
      - 'package-lock.json'
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - 'package-lock.json'
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  sync-overrides:
    name: Sync Production Overrides
    runs-on: hiero-solo-linux-medium
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Regenerate production overrides
        run: node scripts/update-production-overrides.mjs

      - name: Validate package.json unchanged
        run:
          # Git diff to see if the package.json file has changed after regenerating overrides
          git diff --exit-code package.json