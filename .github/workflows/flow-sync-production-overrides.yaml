name: "Sync Production Overrides"
# Regenerates the supply-chain pin overrides in package.json whenever
# package-lock.json changes (e.g. after a Dependabot dependency update).
# If the overrides are stale the job commits the refreshed package.json
# back to the branch that triggered the run.

on:
  push:
    branches:
      - main
      - 'release/*'
      - 'dependabot/**'
    paths:
      - 'package-lock.json'
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - 'package-lock.json'
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  sync-overrides:
    name: Sync Production Overrides
    runs-on: hiero-solo-linux-medium
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Regenerate production overrides
        run: node scripts/update-production-overrides.mjs

      - name: Commit updated overrides if changed
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const newContent = fs.readFileSync('package.json', 'utf8');

            const ref = context.payload.pull_request?.head?.ref ?? context.ref.replace('refs/heads/', '');

            // Fetch current file to get its blob SHA (required by the API for updates).
            const {data: current} = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'package.json',
              ref,
            });

            if (Buffer.from(current.content, 'base64').toString('utf8') === newContent) {
              console.log('No changes to commit.');
              return;
            }

            // The GitHub API creates Verified (GPG-signed) commits automatically.
            // The Signed-off-by trailer satisfies the DCO requirement.
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'package.json',
              message: 'chore: sync production dependency overrides\n\nSigned-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>',
              content: Buffer.from(newContent).toString('base64'),
              sha: current.sha,
              branch: ref,
            });

            console.log('Committed refreshed overrides via GitHub API.');
