# SPDX-License-Identifier: Apache-2.0
name: 'ZXC: TCK Release Verification'
# Verifies the Solo TCK before a Solo release publishes it (docs/design/test/solo-tck-conformance-gate.md §6.3, §6.4).
# Every implemented lane runs against every Solo release the kit will list as supported, with the released SDK each
# Solo release ships as the candidate, then the negative controls run. Any failure fails this workflow, which blocks
# the release; on success the `tck-solo-versions` artifact holds the supported list the release commit carries.
on:
  workflow_call:
    inputs:
      version:
        description: 'The Solo version being released, for example 0.100.0'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 'The Solo version being released, for example 0.100.0'
        type: string
        required: true
  # TEMPORARY (remove before merge): proves this workflow on real runners from its own pull request.
  pull_request:
    paths:
      - .github/workflows/zxc-tck-release-verification.yaml

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: hiero-solo-linux-medium
    timeout-minutes: 10
    outputs:
      entries: ${{ steps.plan.outputs.entries }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Plan Verification
        id: plan
        env:
          RELEASE_VERSION: ${{ inputs.version || '0.100.0' }} # TEMPORARY fallback for the pull_request trigger
        run: |
          node tck/src/release.mjs plan --version "${RELEASE_VERSION}" --commit "${GITHUB_SHA}" --out plan.json
          echo "entries=$(jq -c '.entries' plan.json)" >> "${GITHUB_OUTPUT}"

      - name: Upload Plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tck-verification-plan
          path: plan.json
          if-no-files-found: error
          overwrite: true

  lane:
    name: js-sdk lane (Solo ${{ matrix.entry.solo }})
    needs: plan
    if: ${{ needs.plan.outputs.entries != '[]' }}
    runs-on: hiero-solo-linux-large
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.plan.outputs.entries) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Kind
        uses: $/.github/actions/setup-kind
        with:
          version: 'v0.29.0'
          kubectl-version: 'v1.32.2'

      - name: Install Task
        if: ${{ matrix.entry.source == 'release' }}
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.49.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack the Solo Release Candidate
        # The release being cut, built and packed from the verified commit as the release job builds it.
        if: ${{ matrix.entry.source == 'release' }}
        env:
          RELEASE_VERSION: ${{ inputs.version || '0.100.0' }} # TEMPORARY fallback for the pull_request trigger
        run: |
          set -euo pipefail
          npm ci
          npm version "${RELEASE_VERSION}" --no-git-tag-version --allow-same-version
          task build
          mkdir -p "${RUNNER_TEMP}/solo-candidate"
          npm pack --pack-destination "${RUNNER_TEMP}/solo-candidate"
          tarball=$(ls "${RUNNER_TEMP}"/solo-candidate/*.tgz)
          packed=$(tar -xOf "${tarball}" package/package.json | jq -r '.version')
          [[ "${packed}" == "${RELEASE_VERSION}" ]] || { echo "::error::packed Solo ${packed}, expected ${RELEASE_VERSION}"; exit 1; }
          echo "SOLO_TARBALL=${tarball}" >> "${GITHUB_ENV}"

      - name: Pack the Released SDK Candidate
        env:
          SOLO: ${{ matrix.entry.solo }}
          SOURCE: ${{ matrix.entry.source }}
        run: |
          if [[ "${SOURCE}" == "release" ]]; then
            node tck/src/release.mjs sdk --manifest package.json --out "${RUNNER_TEMP}/sdk-candidate"
          else
            node tck/src/release.mjs sdk --solo "${SOLO}" --out "${RUNNER_TEMP}/sdk-candidate"
          fi

      - name: Allow This Solo Release for Verification
        # Verification precedes admission, so the released Solo under test is not supported yet. This edits only
        # this runner's checkout; the published list is written by the admit job from the verified results.
        if: ${{ matrix.entry.source == 'npm' }}
        env:
          SOLO: ${{ matrix.entry.solo }}
        run: |
          jq -n --arg solo "${SOLO}" '{default: $solo, supported: [$solo]}' > tck/solo-versions.json

      - name: Run the js-sdk Lane
        id: lane
        env:
          SOLO: ${{ matrix.entry.solo }}
          SOURCE: ${{ matrix.entry.source }}
        run: |
          if [[ "${SOURCE}" == "release" ]]; then
            node tck/src/run.mjs --component js-sdk --candidate-packages "${RUNNER_TEMP}/sdk-candidate" \
              --solo-version "${GITHUB_SHA}" --solo-tarball "${SOLO_TARBALL}"
          else
            node tck/src/run.mjs --component js-sdk --candidate-packages "${RUNNER_TEMP}/sdk-candidate" \
              --solo-version "${SOLO}"
          fi

      - name: Upload Lane Evidence
        if: ${{ always() && steps.lane.outputs.result-dir != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tck-verification-${{ matrix.entry.solo }}
          path: ${{ steps.lane.outputs.result-dir }}
          if-no-files-found: error
          overwrite: true

  controls:
    name: Negative Controls and Packaging
    needs: plan
    runs-on: hiero-solo-linux-medium
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install Dependencies
        # npm runs Solo's prepare script even for `npm pack --dry-run --ignore-scripts`, and prepare needs node_modules.
        run: npm ci

      - name: Prove the Solo npm Package Excludes the Kit
        run: node tck/src/release.mjs exclusion

      - name: Run Negative Controls
        run: |
          node tck/src/release.mjs sdk --manifest package.json --out "${RUNNER_TEMP}/sdk-candidate"
          node tck/src/release.mjs controls --candidate-packages "${RUNNER_TEMP}/sdk-candidate" --out controls.json

      - name: Upload Control Results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tck-verification-controls
          path: controls.json
          if-no-files-found: ignore
          overwrite: true

  admit:
    name: Admit Supported Solo Releases
    needs:
      - plan
      - lane
      - controls
    # A plan with nothing to verify skips the lane; any lane or control failure leaves admission undone.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.controls.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.lane.result) }}
    runs-on: hiero-solo-linux-medium
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Download Plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tck-verification-plan
          path: verification

      - name: Download Lane Evidence
        if: ${{ needs.lane.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tck-verification-[0-9]*
          path: verification/results

      - name: Admit
        run: |
          mkdir -p verification/results admitted
          node tck/src/release.mjs admit --plan verification/plan.json --results verification/results \
            --out admitted/solo-versions.json
          {
            echo '## Solo TCK release verification'
            echo
            echo '```json'
            cat admitted/solo-versions.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Supported Solo Releases
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tck-solo-versions
          path: admitted/solo-versions.json
          if-no-files-found: error
          overwrite: true
