version: 3

env:
  SOLO_COMMAND:
    sh: |
      if [ "${USE_RELEASED_VERSION}" = "true" ]; then
        echo "npx @hashgraph/solo"
      else
        echo "npm run solo --silent --"
      fi

vars:
  # Network Configuration
  NETWORK_SIZE: '2'
  NODE_ALIASES: 'node1,node2'
  DEPLOYMENT: 'state-restore-deployment'
  NAMESPACE: 'state-restore-namespace'
  ENABLE_MIRROR_WORKFLOW: '{{ default "false" (env "ENABLE_MIRROR_WORKFLOW") }}'

  SOLO_USER_DIR: '{{ default (printf "%s/.solo" (env "HOME")) }}'

  # Cluster Configuration
  CLUSTER_NAME: 'state-restore-cluster'
  CONTEXT: 'kind-state-restore-cluster'
  CLUSTER_REF: 'kind-state-restore-cluster'

  # State Save Configuration
  STATE_SAVE_DIR: '{{ .USER_WORKING_DIR }}/saved-states'
  MIRROR_PASSWORDS_SECRET_FILE: '{{ .STATE_SAVE_DIR }}/mirror-passwords-secret.json'
  ORIGINAL_NETWORK_JSON_FILE: '{{ .STATE_SAVE_DIR }}/original-network.json'
  GENERATED_OVERRIDE_NETWORK_JSON_FILE: '{{ .STATE_SAVE_DIR }}/override-network.json'
  CURRENT_SERVICE_ENDPOINTS_FILE: '{{ .STATE_SAVE_DIR }}/current-service-endpoints.json'
  OVERRIDE_NETWORK_GENERATOR_SCRIPT: '{{ .TASKFILE_DIR }}/scripts/generate-override-network.mjs'
  PREPULL_IMAGES_SCRIPT: '{{ .TASKFILE_DIR }}/scripts/prepull-images.sh'
  SAVED_KEYS_DIR: '{{ .STATE_SAVE_DIR }}/keys'
  SOLO_CACHE_KEYS_DIR: '{{ .SOLO_USER_DIR }}/cache/keys'

  # External Database Configuration (Optional)
  POSTGRES_USERNAME: 'postgres'
  POSTGRES_PASSWORD: 'XXXXXXXX'
  POSTGRES_READONLY_USERNAME: 'readonlyuser'
  POSTGRES_READONLY_PASSWORD: 'XXXXXXXX'
  POSTGRES_MIRROR_NODE_DATABASE_NAME: 'mirror_node'
  POSTGRES_NAME: 'my-postgresql'
  POSTGRES_DATABASE_NAMESPACE: 'database'
  POSTGRES_CONTAINER_NAME: '{{ .POSTGRES_NAME }}-0'
  POSTGRES_HOST_FQDN: '{{ .POSTGRES_NAME }}.database.svc.cluster.local'

tasks:
  # ==================== Main Tasks ====================

  default:
    desc: Run complete workflow - setup, save state, restore, and verify
    cmds:
      - task: setup
      - cmd: echo ""
      - cmd: echo "⏳ Waiting 10 seconds for network to stabilize..."
      - cmd: sleep 10
      # must freeze network before saving state otherwise may get error "file changed as we read it"
      - task: stop-network
      - task: save-state
      - cmd: echo ""
      - cmd: echo "⏳ Waiting 10 seconds before fresh-cluster restore..."
      - cmd: sleep 10
      - task: restore
      - cmd: echo ""
      - cmd: echo "🎉 Complete workflow finished successfully!"
      - cmd: echo "Run 'task destroy' to clean up resources"

  # ==================== Setup Tasks ====================

  setup:
    desc: Deploy initial network with external PostgreSQL database
    cmds:
      - task: create-cluster
      - task: preload-network-images
      - task: init-solo
      - task: deploy-block-node
      - task: deploy-network
      - cmd: |
          if [ "{{ .ENABLE_MIRROR_WORKFLOW }}" = "true" ]; then
            task deploy-external-database
            task deploy-mirror-external
          else
            echo "Skipping mirror/database setup; set ENABLE_MIRROR_WORKFLOW=true to include it."
          fi
      - task: generate-transactions
      - cmd: echo "✅ Initial network with external database setup complete!"
      - cmd: echo "Run 'task save-state' to save state and database"

  # ==================== Infrastructure Tasks ====================

  create-cluster:
    desc: Create Kind cluster
    cmds:
      - cmd: |
          if [ "${USE_RELEASED_VERSION}" = "true" ]; then
            npm i @hashgraph/solo@latest
          else
            echo "Using development version of Solo"
          fi
      - cmd: |
          SHARED_KIND_CONFIG="{{ .TASKFILE_DIR }}/../../resources/kind-config.yaml"
          if [ -f "${SHARED_KIND_CONFIG}" ]; then
            kind create cluster -n {{ .CLUSTER_NAME }} --config "${SHARED_KIND_CONFIG}"
          else
            kind create cluster -n {{ .CLUSTER_NAME }}
          fi
      - cmd: sleep 10 # Wait for control plane
      - cmd: kubectl config use-context {{ .CONTEXT }}

  preload-network-images:
    desc: Pre-pull and load consensus-network images into the Kind cluster
    cmds:
      - cmd: bash {{ .PREPULL_IMAGES_SCRIPT }} {{ .CLUSTER_NAME }}

  init-solo:
    desc: Connect cluster reference and configure deployment
    cmds:
      - cmd: $SOLO_COMMAND cluster-ref config connect --cluster-ref {{ .CLUSTER_REF }} --context {{ .CONTEXT }} --quiet-mode
      - cmd: $SOLO_COMMAND deployment config create --namespace {{ .NAMESPACE }} --deployment {{ .DEPLOYMENT }} --realm 0 --shard 0
      - cmd: $SOLO_COMMAND deployment cluster attach --cluster-ref {{ .CLUSTER_REF }} --deployment {{ .DEPLOYMENT }} --num-consensus-nodes {{ .NETWORK_SIZE }}

  # ==================== Network Deployment Tasks ====================

  deploy-network:
    desc: Deploy consensus network
    cmds:
      - cmd: $SOLO_COMMAND keys consensus generate --gossip-keys --tls-keys --node-aliases {{ .NODE_ALIASES }} --deployment {{ .DEPLOYMENT }}
      - cmd: |
          $SOLO_COMMAND consensus network deploy --deployment {{ .DEPLOYMENT }} --node-aliases {{ .NODE_ALIASES }} \
            --enable-monitoring-support false --quiet-mode --dev
      - cmd: $SOLO_COMMAND consensus node setup --deployment {{ .DEPLOYMENT }} --node-aliases {{ .NODE_ALIASES }}
      - cmd: $SOLO_COMMAND consensus node start --deployment {{ .DEPLOYMENT }} --node-aliases {{ .NODE_ALIASES }}
      - cmd: echo "✅ Consensus network deployed with {{ .NETWORK_SIZE }} nodes"

  deploy-mirror-external:
    desc: Deploy mirror node with external database
    cmds:
      # Solo mirror node add"
      - cmd: |
          $SOLO_COMMAND mirror node add --deployment {{ .DEPLOYMENT }} --use-external-database \
          --enable-ingress --external-database-host {{ .POSTGRES_HOST_FQDN }} \
          --external-database-owner-username {{ .POSTGRES_USERNAME }} --external-database-owner-password {{ .POSTGRES_PASSWORD }} \
          --external-database-read-username {{ .POSTGRES_READONLY_USERNAME }} \
          --external-database-read-password {{ .POSTGRES_READONLY_PASSWORD }} \
          --enable-ingress --pinger -q --dev
      - cmd: echo "✅ Mirror node deployed with external PostgreSQL database"

  # ==================== External Database Tasks ====================

  deploy-external-database:
    desc: Deploy external PostgreSQL database
    cmds:
      # Install PostgreSQL using Helm"
      - cmd: |
          PATH="{{ .SOLO_USER_DIR }}/bin:$PATH"
          helm repo add postgresql-helm https://leverages.github.io/helm
          helm install {{ .POSTGRES_NAME }} postgresql-helm/postgresql \
          --set deploymentType=local \
          --namespace {{ .POSTGRES_DATABASE_NAMESPACE }} --create-namespace \
          --set postgresql.auth.password={{ .POSTGRES_PASSWORD }}

      # Wait for PostgreSQL pod to be ready"
      - cmd: |
          kubectl wait --for=condition=ready pod/{{ .POSTGRES_CONTAINER_NAME }} \
          -n {{ .POSTGRES_DATABASE_NAMESPACE }} --timeout=300s

      # Copy init.sql inside the database pod"
      - cmd: |
          kubectl cp {{ .TASKFILE_DIR }}/scripts/init.sh \
          {{ .POSTGRES_CONTAINER_NAME }}:/tmp/init.sh \
          -n {{ .POSTGRES_DATABASE_NAMESPACE }}

      # Make init.sh executable"
      - cmd: |
          kubectl exec -it {{ .POSTGRES_CONTAINER_NAME }} \
          -n {{ .POSTGRES_DATABASE_NAMESPACE }} -- chmod +x /tmp/init.sh

      # Execute init.sh inside the database pod"
      - cmd: |
          kubectl exec -it {{ .POSTGRES_CONTAINER_NAME }} \
          -n {{ .POSTGRES_DATABASE_NAMESPACE }} \
          -- /bin/bash /tmp/init.sh "{{ .POSTGRES_USERNAME }}" "{{ .POSTGRES_READONLY_USERNAME }}" "{{ .POSTGRES_READONLY_PASSWORD }}"

  # ==================== Transaction Generation ====================

  generate-transactions:
    desc: Generate sample transactions to create state
    cmds:
      - cmd: echo "Generating sample transactions..."
      - cmd: |
          for i in {1..3}; do
            $SOLO_COMMAND ledger account create --deployment {{ .DEPLOYMENT }} --hbar-amount 100
            sleep 2
          done
      - cmd: echo "✅ Sample transactions completed - network state created"

  # ==================== State Save Tasks ====================

  save-state:
    desc: Download consensus node state and export database
    cmds:
      - cmd: mkdir -p {{ .STATE_SAVE_DIR }}
      - cmd: echo "Downloading state from consensus nodes..."
      - cmd: $SOLO_COMMAND consensus state download --deployment {{ .DEPLOYMENT }} --node-aliases {{ .NODE_ALIASES }}
      - cmd: |
          # Move downloaded state files to save directory
          mkdir -p "{{ .STATE_SAVE_DIR }}/{{ .NAMESPACE }}"
          for node in $(echo {{ .NODE_ALIASES }} | tr ',' ' '); do
            STATE_FILE="network-${node}-0-state.zip"
            if [ -f "$HOME/.solo/logs/{{ .NAMESPACE }}/${STATE_FILE}" ]; then
              cp "$HOME/.solo/logs/{{ .NAMESPACE }}/${STATE_FILE}" "{{ .STATE_SAVE_DIR }}/{{ .NAMESPACE }}/"
              echo "✅ Saved state for ${node} (${STATE_FILE})"
            else
              echo "⚠️  State file not found: $HOME/.solo/logs/{{ .NAMESPACE }}/${STATE_FILE}"
              exit 1
            fi
          done
      - cmd: echo "Exporting database..."
      - cmd: |
          if [ "{{ .ENABLE_MIRROR_WORKFLOW }}" = "true" ]; then
            kubectl exec {{ .POSTGRES_CONTAINER_NAME }} -n {{ .POSTGRES_DATABASE_NAMESPACE }} -- \
            env PGPASSWORD={{ .POSTGRES_PASSWORD }} pg_dump -U {{ .POSTGRES_USERNAME }} \
            --clean --if-exists \
            {{ .POSTGRES_MIRROR_NODE_DATABASE_NAME }} > {{ .STATE_SAVE_DIR }}/database-dump.sql
          else
            echo "Skipping database export; mirror workflow disabled."
          fi
      - cmd: echo "Saving source network JSON..."
      - cmd: |
          kubectl exec network-node1-0 -n {{ .NAMESPACE }} -c root-container -- bash -c '
            if [ -f /opt/hgcapp/services-hedera/HapiApp2.0/output/network.json ]; then
              cat /opt/hgcapp/services-hedera/HapiApp2.0/output/network.json
            elif [ -f /opt/hgcapp/services-hedera/HapiApp2.0/data/config/genesis-network.json ]; then
              cat /opt/hgcapp/services-hedera/HapiApp2.0/data/config/genesis-network.json
            elif [ -f /opt/hgcapp/services-hedera/HapiApp2.0/data/config/.archive/genesis-network.json ]; then
              cat /opt/hgcapp/services-hedera/HapiApp2.0/data/config/.archive/genesis-network.json
            else
              echo "No usable network JSON found in node pod" >&2
              exit 1
            fi
          ' > {{ .ORIGINAL_NETWORK_JSON_FILE }}
      - cmd: echo "✅ Source network JSON exported to {{ .ORIGINAL_NETWORK_JSON_FILE }}"
      - cmd: echo "Saving mirror passwords secret..."
      - cmd: |
          if [ "{{ .ENABLE_MIRROR_WORKFLOW }}" = "true" ]; then
            kubectl get secret mirror-passwords -n {{ .NAMESPACE }} -o json | \
            jq 'del(
              .metadata.annotations."kubectl.kubernetes.io/last-applied-configuration",
              .metadata.creationTimestamp,
              .metadata.managedFields,
              .metadata.resourceVersion,
              .metadata.uid
            )' > {{ .MIRROR_PASSWORDS_SECRET_FILE }}
            echo "✅ Mirror passwords secret exported to {{ .MIRROR_PASSWORDS_SECRET_FILE }}"
          else
            echo "Skipping mirror secret export; mirror workflow disabled."
          fi
      - cmd: echo "Saving consensus node key material from Kubernetes secrets..."
      - cmd: mkdir -p {{ .SAVED_KEYS_DIR }}
      - cmd: |
          kubectl get secret network-node-hapi-app-secrets -n {{ .NAMESPACE }} -o json | \
          jq -r '.data | to_entries[] | @base64' | \
          while IFS= read -r entry; do
            key_file_name="$(printf '%s' "${entry}" | base64 --decode | jq -r '.key')"
            key_file_value="$(printf '%s' "${entry}" | base64 --decode | jq -r '.value')"
            printf '%s' "${key_file_value}" | base64 --decode > "{{ .SAVED_KEYS_DIR }}/${key_file_name}"
            chmod 600 "{{ .SAVED_KEYS_DIR }}/${key_file_name}"
            echo "✅ Saved TLS key file ${key_file_name}"
          done
      - cmd: |
          for node in $(echo {{ .NODE_ALIASES }} | tr ',' ' '); do
            kubectl get secret network-${node}-keys-secrets -n {{ .NAMESPACE }} -o json | \
            jq -r '.data | to_entries[] | @base64' | \
            while IFS= read -r entry; do
              key_file_name="$(printf '%s' "${entry}" | base64 --decode | jq -r '.key')"
              key_file_value="$(printf '%s' "${entry}" | base64 --decode | jq -r '.value')"
              printf '%s' "${key_file_value}" | base64 --decode > "{{ .SAVED_KEYS_DIR }}/${key_file_name}"
              chmod 600 "{{ .SAVED_KEYS_DIR }}/${key_file_name}"
              echo "✅ Saved gossip key file ${key_file_name}"
            done
          done
      - cmd: echo "✅ Database exported to {{ .STATE_SAVE_DIR }}/database-dump.sql"
      - cmd: echo "✅ Network state and database saved to {{ .STATE_SAVE_DIR }}"
      - cmd: ls -lh {{ .STATE_SAVE_DIR }}

  # ==================== State Restore Tasks ====================

  restore:
    desc: Recreate a fresh cluster, restore state, and verify the saved network can boot again
    cmds:
      - task: destroy-network
      - cmd: |
          if [ "{{ .ENABLE_MIRROR_WORKFLOW }}" = "true" ]; then
            task destroy-database
          else
            echo "Skipping database cleanup; mirror workflow disabled."
          fi
      - task: destroy-cluster
      - task: create-cluster
      - task: preload-network-images
      - task: init-solo
      - task: restore-consensus-keys
      - task: deploy-block-node
      - task: deploy-network-with-state
      - cmd: |
          if [ "{{ .ENABLE_MIRROR_WORKFLOW }}" = "true" ]; then
            task deploy-external-database
            task restore-mirror-passwords-secret
            task restore-database
            task deploy-mirror-external
          else
            echo "Skipping mirror/database restore; consensus override-network test only."
          fi
      - task: verify-state
      - cmd: echo "✅ Network and database restored!"

  deploy-network-with-state:
    desc: Deploy a fresh network and start nodes from saved state with override-network endpoint remapping
    cmds:
      - cmd: echo "Deploying network with saved state..."
      - cmd: |
          echo "This workflow validates saved-state startup on a freshly recreated cluster."
          echo "It rewrites the saved roster with override-network.json so the restarted"
          echo "nodes adopt the fresh cluster's current gossip service IPs."
      - cmd: |
          $SOLO_COMMAND consensus network deploy --deployment {{ .DEPLOYMENT }} --node-aliases {{ .NODE_ALIASES }}
      - cmd: $SOLO_COMMAND consensus node setup --deployment {{ .DEPLOYMENT }} --node-aliases {{ .NODE_ALIASES }}
      - cmd: |
          echo "Waiting for recreated consensus pods to exist before restore..."
          for node in $(echo {{ .NODE_ALIASES }} | tr ',' ' '); do
            kubectl wait --for=create pod/network-${node}-0 -n {{ .NAMESPACE }} --timeout=300s
          done
      - task: generate-override-network
      - task: install-override-network
      - cmd: |
          # Build the directory layout expected by Solo for per-node state restore:
          # <input>/states/<cluster-ref>/<namespace>/network-<node>-0-state.zip
          RESTORE_INPUT_DIR="{{ .STATE_SAVE_DIR }}/restore-input"
          RESTORE_STATES_DIR="${RESTORE_INPUT_DIR}/states/{{ .CLUSTER_REF }}/{{ .NAMESPACE }}"
          RESTORE_ROUND=""
          rm -rf "${RESTORE_STATES_DIR}"
          mkdir -p "${RESTORE_STATES_DIR}"

          for node in $(echo {{ .NODE_ALIASES }} | tr ',' ' '); do
            NODE_STATE_FILE="network-${node}-0-state.zip"
            SRC_STATE_FILE_PATH="{{ .STATE_SAVE_DIR }}/{{ .NAMESPACE }}/${NODE_STATE_FILE}"
            DEST_STATE_FILE_PATH="${RESTORE_STATES_DIR}/${NODE_STATE_FILE}"

            if [ ! -f "${SRC_STATE_FILE_PATH}" ]; then
              echo "⚠️  State file not found for ${node}: ${SRC_STATE_FILE_PATH}"
              exit 1
            fi

            cp "${SRC_STATE_FILE_PATH}" "${DEST_STATE_FILE_PATH}"
            TMP_STATE_DIR="$(mktemp -d)"
            unzip -q "${DEST_STATE_FILE_PATH}" -d "${TMP_STATE_DIR}"

            # Build a deterministic single-round archive for restore. The
            # workflow now captures state from a frozen network, so prefer the
            # fully signed freeze round as the exact recovery boundary. The
            # download step requires this boundary for a frozen deployment.
            NODE_STATE_ROOT="$(find "${TMP_STATE_DIR}/com.hedera.services.ServicesMain" -mindepth 2 -maxdepth 2 -type d | head -n 1)"
            if [ -z "${NODE_STATE_ROOT}" ]; then
              echo "⚠️  Could not locate saved state rounds in ${DEST_STATE_FILE_PATH}"
              exit 1
            fi

            SELECTED_ROUND=""
            FALLBACK_ROUND=""
            # Sort on the numeric basename rather than the full temporary path;
            # otherwise `sort -n` can choose a stale round unpredictably.
            for round_dir in $(
              find "${NODE_STATE_ROOT}" -mindepth 1 -maxdepth 1 -type d -print |
                while IFS= read -r candidate_dir; do
                  printf '%s\t%s\n' "$(basename "${candidate_dir}")" "${candidate_dir}"
                done |
                sort -n -k1,1 |
                cut -f2-
            ); do
              metadata_file="${round_dir}/stateMetadata.txt"
              if [ ! -f "${metadata_file}" ]; then
                continue
              fi

              freeze_state="$(awk -F: '/^FREEZE_STATE:/ {gsub(/^[ \t]+|[ \t]+$/, "", $2); print $2}' "${metadata_file}")"
              signing_weight="$(awk -F: '/^SIGNING_WEIGHT_SUM:/ {gsub(/^[ \t]+|[ \t]+$/, "", $2); print $2}' "${metadata_file}")"
              total_weight="$(awk -F: '/^TOTAL_WEIGHT:/ {gsub(/^[ \t]+|[ \t]+$/, "", $2); print $2}' "${metadata_file}")"

              if [ -n "${signing_weight}" ] && [ "${signing_weight}" = "${total_weight}" ] && [ "${freeze_state}" = "true" ]; then
                SELECTED_ROUND="$(basename "${round_dir}")"
                break
              fi

              if [ -n "${signing_weight}" ] && [ "${signing_weight}" = "${total_weight}" ] && [ "${freeze_state}" = "false" ]; then
                FALLBACK_ROUND="$(basename "${round_dir}")"
              fi
            done

            if [ -z "${SELECTED_ROUND}" ]; then
              SELECTED_ROUND="${FALLBACK_ROUND}"
            fi

            if [ -z "${SELECTED_ROUND}" ]; then
              echo "⚠️  Could not find a fully signed round in ${DEST_STATE_FILE_PATH}"
              exit 1
            fi

            if [ -n "${RESTORE_ROUND}" ] && [ "${RESTORE_ROUND}" != "${SELECTED_ROUND}" ]; then
              echo "⚠️  Nodes selected different restore rounds: ${RESTORE_ROUND} and ${SELECTED_ROUND}"
              exit 1
            fi
            RESTORE_ROUND="${SELECTED_ROUND}"

            find "${NODE_STATE_ROOT}" -mindepth 1 -maxdepth 1 -type d ! -name "${SELECTED_ROUND}" -exec rm -rf {} +

            # Preserve the captured PCES directory. It is part of the exact
            # state/round boundary and is required for the restored platform to
            # advance from OBSERVING/CHECKING. The cleanup helper preserves this
            # captured replay input while removing superseded state directories.
            # Remove unrelated replay/cache directories before restore.
            rm -rf "${TMP_STATE_DIR}/saved"
            rm -rf "${TMP_STATE_DIR}/swirlds-tmp"

            rm -f "${DEST_STATE_FILE_PATH}"
            ORIGINAL_WORKDIR="${PWD}"
            cd "${TMP_STATE_DIR}"
            zip -qr "${DEST_STATE_FILE_PATH}" .
            cd "${ORIGINAL_WORKDIR}"
            rm -rf "${TMP_STATE_DIR}"
            echo "Prepared state for ${node}: ${DEST_STATE_FILE_PATH} (round ${SELECTED_ROUND})"
          done

          # Apply the endpoint transplant after the snapshot's signed round.
          # If the override is staged at the snapshot round, Hedera mutates the
          # roster before validating that round's state signature and reports an
          # ISS. Placing it at the next round lets startup verify the snapshot
          # first, then apply the fresh cluster endpoints during replay.
          OVERRIDE_ROUND=$((RESTORE_ROUND + 1))
          for node in $(echo {{ .NODE_ALIASES }} | tr ',' ' '); do
            kubectl exec network-${node}-0 -n {{ .NAMESPACE }} -c root-container -- \
              bash -c "mkdir -p /opt/hgcapp/services-hedera/HapiApp2.0/data/config/${OVERRIDE_ROUND} && mv /opt/hgcapp/services-hedera/HapiApp2.0/data/config/override-network.json /opt/hgcapp/services-hedera/HapiApp2.0/data/config/${OVERRIDE_ROUND}/override-network.json"
            kubectl exec network-${node}-0 -n {{ .NAMESPACE }} -c root-container -- \
              ls -l /opt/hgcapp/services-hedera/HapiApp2.0/data/config/${OVERRIDE_ROUND}/override-network.json
          done

          echo "Prepared restore input:"
          find "${RESTORE_INPUT_DIR}" -maxdepth 4 -type f | sort

          # Start all nodes together so they replay the same restored boundary.
          $SOLO_COMMAND consensus node start --deployment {{ .DEPLOYMENT }} --node-aliases {{ .NODE_ALIASES }} \
            --state-file "${RESTORE_INPUT_DIR}"
      - cmd: echo "✅ Nodes started with restored state"

  restore-consensus-keys:
    desc: Restore saved consensus key material into Solo cache
    cmds:
      - cmd: |
          if [ ! -d {{ .SAVED_KEYS_DIR }} ]; then
            echo "⚠️  Saved key directory not found: {{ .SAVED_KEYS_DIR }}"
            exit 1
          fi
      - cmd: mkdir -p "{{ .SOLO_CACHE_KEYS_DIR }}"
      - cmd: find "{{ .SOLO_CACHE_KEYS_DIR }}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
      - cmd: cp "{{ .SAVED_KEYS_DIR }}"/* "{{ .SOLO_CACHE_KEYS_DIR }}/"
      - cmd: chmod 600 "{{ .SOLO_CACHE_KEYS_DIR }}"/*
      - cmd: echo "✅ Restored consensus key material to {{ .SOLO_CACHE_KEYS_DIR }}"

  generate-override-network:
    desc: Generate override-network.json using the fresh cluster service IPs
    cmds:
      - cmd: |
          if [ ! -f {{ .ORIGINAL_NETWORK_JSON_FILE }} ]; then
            echo "⚠️  Saved source network JSON not found: {{ .ORIGINAL_NETWORK_JSON_FILE }}"
            exit 1
          fi
      - cmd: |
          kubectl get service -n {{ .NAMESPACE }} -o json > {{ .CURRENT_SERVICE_ENDPOINTS_FILE }}
      - cmd: |
          node {{ .OVERRIDE_NETWORK_GENERATOR_SCRIPT }} \
            --source-network {{ .ORIGINAL_NETWORK_JSON_FILE }} \
            --services-json {{ .CURRENT_SERVICE_ENDPOINTS_FILE }} \
            --node-aliases {{ .NODE_ALIASES }} \
            --output {{ .GENERATED_OVERRIDE_NETWORK_JSON_FILE }}
      - cmd: echo "✅ Generated override-network.json at {{ .GENERATED_OVERRIDE_NETWORK_JSON_FILE }}"

  install-override-network:
    desc: Copy override-network.json into each consensus node pod
    cmds:
      - cmd: |
          if [ ! -f {{ .GENERATED_OVERRIDE_NETWORK_JSON_FILE }} ]; then
            echo "⚠️  Generated override-network.json not found: {{ .GENERATED_OVERRIDE_NETWORK_JSON_FILE }}"
            exit 1
          fi
      - cmd: |
          for node in $(echo {{ .NODE_ALIASES }} | tr ',' ' '); do
            kubectl cp {{ .GENERATED_OVERRIDE_NETWORK_JSON_FILE }} \
              {{ .NAMESPACE }}/network-${node}-0:/opt/hgcapp/services-hedera/HapiApp2.0/data/config/override-network.json \
              -c root-container
            kubectl exec network-${node}-0 -n {{ .NAMESPACE }} -c root-container -- \
              ls -l /opt/hgcapp/services-hedera/HapiApp2.0/data/config/override-network.json
          done
      - cmd: echo "✅ override-network.json copied to each consensus node pod"

  restore-database:
    desc: Restore database from dump
    cmds:
      - cmd: echo "Restoring database from dump..."
      - cmd: |
          if [ -f {{ .MIRROR_PASSWORDS_SECRET_FILE }} ]; then
            echo "Recreating mirror database roles from saved credentials..."
            jq -r '.data | keys[]' {{ .MIRROR_PASSWORDS_SECRET_FILE }} | while read -r key; do
              case "${key}" in
                *USERNAME)
                  password_key="${key%USERNAME}PASSWORD"
                  username="$(jq -r --arg key "${key}" '.data[$key] | @base64d' {{ .MIRROR_PASSWORDS_SECRET_FILE }})"
                  password="$(jq -r --arg key "${password_key}" '.data[$key] // empty | @base64d' {{ .MIRROR_PASSWORDS_SECRET_FILE }})"

                  case "${username}" in
                    postgres|readonly|readonlyuser|readwrite|temporary_admin|"")
                      continue
                      ;;
                  esac

                  if [ -z "${password}" ]; then
                    continue
                  fi

                  username_sql="$(printf "%s" "${username}" | sed 's/"/""/g')"
                  role_name_sql="$(printf "%s" "${username}" | sed "s/'/''/g")"
                  password_sql="$(printf "%s" "${password}" | sed "s/'/''/g")"

                  kubectl exec {{ .POSTGRES_CONTAINER_NAME }} -n {{ .POSTGRES_DATABASE_NAMESPACE }} -- \
                    env PGPASSWORD={{ .POSTGRES_PASSWORD }} psql -U {{ .POSTGRES_USERNAME }} -d postgres \
                    -v ON_ERROR_STOP=1 \
                    -c "DO \$\$ BEGIN IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${role_name_sql}') THEN ALTER ROLE \"${username_sql}\" WITH LOGIN PASSWORD '${password_sql}'; ELSE CREATE ROLE \"${username_sql}\" WITH LOGIN PASSWORD '${password_sql}'; END IF; END \$\$;"
                  echo "✅ Reconciled role ${username}"
                  ;;
              esac
            done
          fi
      - cmd: |
          kubectl cp {{ .STATE_SAVE_DIR }}/database-dump.sql \
          {{ .POSTGRES_CONTAINER_NAME }}:/tmp/database-dump.sql -n {{ .POSTGRES_DATABASE_NAMESPACE }}
      - cmd: |
          kubectl exec {{ .POSTGRES_CONTAINER_NAME }} -n {{ .POSTGRES_DATABASE_NAMESPACE }} -- \
          env PGPASSWORD={{ .POSTGRES_PASSWORD }} psql -U {{ .POSTGRES_USERNAME }} \
          -d {{ .POSTGRES_MIRROR_NODE_DATABASE_NAME }} -f /tmp/database-dump.sql
      - cmd: echo "✅ Database restored"

  restore-mirror-passwords-secret:
    desc: Restore saved mirror database credential secret
    cmds:
      - cmd: |
          if [ ! -f {{ .MIRROR_PASSWORDS_SECRET_FILE }} ]; then
            echo "⚠️  Saved mirror-passwords secret not found: {{ .MIRROR_PASSWORDS_SECRET_FILE }}"
            exit 1
          fi
      - cmd: kubectl apply -f {{ .MIRROR_PASSWORDS_SECRET_FILE }}
      - cmd: echo "✅ Restored mirror-passwords secret"

  # ==================== Verification ====================

  verify-state:
    desc: Verify restored state without submitting transactions to a frozen network
    cmds:
      - cmd: |
          echo "Verifying restored frozen state..."
          for node in $(echo {{ .NODE_ALIASES }} | tr ',' ' '); do
            kubectl exec network-${node}-0 -n {{ .NAMESPACE }} -c root-container -- \
              sh -c 'curl -sf http://localhost:9999/metrics | grep platform_PlatformStatus | grep -v "^#" | grep -q " 6\\.0$"'
            if kubectl logs network-${node}-0 -n {{ .NAMESPACE }} -c root-container --tail=500 | grep -q "Invalid State Signature"; then
              echo "⚠️  Invalid state signature found in restored ${node} logs"
              exit 1
            fi
          done
      - cmd: echo "✅ State verification complete - both restored nodes are FREEZE_COMPLETE with no ISS"

  # ==================== Cleanup Tasks ====================

  stop-network:
    desc: Stop consensus network
    cmds:
      # freeze network before download otherwise may get error "file changed as we read it"
      - cmd: echo "Freezing network..."
      - cmd: $SOLO_COMMAND consensus network freeze --deployment {{ .DEPLOYMENT }}
      - cmd: echo "Waiting for the saved state files to stabilize before download..."
      - cmd: sleep 30
      - cmd: echo "✅ Network frozen"

  destroy-network:
    desc: Destroy mirror node, block node, and consensus network while keeping cluster configuration
    cmds:
      - cmd: echo "Destroying mirror node, block node, and consensus network..."
      - cmd: $SOLO_COMMAND mirror node destroy --deployment {{ .DEPLOYMENT }} --force || true
      - cmd: $SOLO_COMMAND block node destroy --deployment {{ .DEPLOYMENT }} --force || true
      - cmd: $SOLO_COMMAND consensus node stop --deployment {{ .DEPLOYMENT }} --node-aliases {{ .NODE_ALIASES }} || true
      - cmd: $SOLO_COMMAND consensus network destroy --deployment {{ .DEPLOYMENT }} --force -q || true
      - cmd: echo "✅ Network resources destroyed"

  destroy-database:
    desc: Destroy external database
    cmds:
      - cmd: |
          PATH="{{ .SOLO_USER_DIR }}/bin:$PATH"
          helm uninstall {{ .POSTGRES_NAME }} -n {{ .POSTGRES_DATABASE_NAMESPACE }} || true
      - cmd: kubectl delete namespace {{ .POSTGRES_DATABASE_NAMESPACE }} --ignore-not-found=true || true
      - cmd: echo "✅ Database destroyed"

  destroy:
    desc: Destroy cluster and clean up all resources
    cmds:
      - task: destroy-network
      - task: destroy-database
      - task: destroy-cluster
      - task: clean-state

  destroy-cluster:
    desc: Delete the Kind cluster
    cmds:
      - cmd: kind delete cluster --name {{ .CLUSTER_NAME }} || true
      - cmd: echo "✅ Cluster destroyed"

  clean-state:
    desc: Remove saved state files
    cmds:
      - cmd: rm -rf {{ .STATE_SAVE_DIR }}
      - cmd: echo "✅ Saved state files removed"
  deploy-block-node:
    desc: Deploy block node so CN v0.74 does not require MinIO-backed stream storage
    cmds:
      - cmd: $SOLO_COMMAND block node add --deployment {{ .DEPLOYMENT }} --quiet-mode --dev
      - cmd: echo "✅ Block node deployed"
