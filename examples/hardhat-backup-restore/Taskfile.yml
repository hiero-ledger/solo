version: 3

env:
  SOLO_COMMAND:
    sh: |
      if [ "${USE_RELEASED_VERSION}" = "true" ]; then
        echo "npx @hashgraph/solo"
      else
        echo "npm run solo --"
      fi
  TIMEOUT_COMMAND:
    sh: command -v gtimeout >/dev/null 2>&1 && echo "gtimeout" || echo "timeout"

vars:
  DEPLOYMENT: "hardhat-backup-restore"
  NODE_ALIASES: "node1,node2"
  BACKUP_DIR: "{{ .USER_WORKING_DIR }}/solo-backup"
  ZIP_PASSWORD: "xxxx"
  ZIP_FILE: "{{ .BACKUP_DIR }}/solo-backup.zip"
  NETWORK_SIZE: "2"
  NAMESPACE: "hardhat-backup-restore"
  CLUSTER_NAME: "hardhat-backup-restore-cluster"
  CONTEXT: "kind-hardhat-backup-restore-cluster"
  CLUSTER_REF: "kind-hardhat-backup-restore-cluster"
  # First two private keys in hardhat-example/hardhat.config.ts
  HARDHAT_ACCOUNT_KEYS: "0x105d050185ccb907fba04dd92d8de9e32c18305e097ab41dadda21489a211524 0x2e1d968b041d84dd120a5860cee60cd83f9374ef527ca86996317ada3d0d03e7"
  POSTGRES_USERNAME: "postgres"
  POSTGRES_PASSWORD: "XXXXXXX"
  POSTGRES_READONLY_USERNAME: "readonlyuser"
  POSTGRES_READONLY_PASSWORD: "XXXXXXXX"
  POSTGRES_NAME: "my-postgresql"
  POSTGRES_DATABASE_NAMESPACE: "database"
  POSTGRES_CONTAINER_NAME: "my-postgresql-0"
  POSTGRES_HOST_FQDN: "my-postgresql.database.svc.cluster.local"
  POSTGRES_MIRROR_NODE_DATABASE_NAME: "mirror_node"
  EXTERNAL_DB_PARAMS_FILE: "{{ .USER_WORKING_DIR }}/solo-backup/external-database-params.json"
  STATE_SNAPSHOT_WAIT_SECONDS: "120"
  HARDHAT_DIR: "{{ .TASKFILE_DIR }}/hardhat-example"
  HARDHAT_NETWORK: "my_solo_deployment"

tasks:
  default:
    desc: Run the full workflow - deploy, test, backup, reset, restore, and re-test
    cmds:
      - task: deploy
      - task: pre-backup-test
      - task: backup
      - task: reset
      - task: restore
      - task: post-restore-test
      - cmd: echo "✅ Backup/reset/restore workflow completed. Run 'task destroy' to clean up."

  # ==================== Deploy ====================

  deploy:
    desc: Create a Kind cluster and deploy a two-node network with block, mirror (external database), relay and explorer nodes
    cmds:
      - cmd: |
          if [ "${USE_RELEASED_VERSION}" = "true" ]; then
            npm i @hashgraph/solo@latest
          else
            echo "Skipping npm install - using development version"
          fi
      - cmd: rm -rf {{ .BACKUP_DIR }}
      - cmd: |
          SHARED_KIND_CONFIG="{{ .TASKFILE_DIR }}/../../resources/kind-config.yaml"
          if [ -f "${SHARED_KIND_CONFIG}" ]; then
            kind create cluster -n {{ .CLUSTER_NAME }} --config "${SHARED_KIND_CONFIG}"
          else
            kind create cluster -n {{ .CLUSTER_NAME }}
          fi
      - cmd: sleep 10 # Wait for control plane
      - cmd: kubectl config use-context {{ .CONTEXT }}
      - cmd: $SOLO_COMMAND cluster-ref config setup --cluster-ref {{ .CLUSTER_REF }} --quiet-mode --dev
      - cmd: $SOLO_COMMAND cluster-ref config connect --cluster-ref {{ .CLUSTER_REF }} --context {{ .CONTEXT }}
      - cmd: $SOLO_COMMAND deployment config create --deployment {{ .DEPLOYMENT }} --namespace {{ .NAMESPACE }}
      - cmd: |
          $SOLO_COMMAND deployment cluster attach --deployment {{ .DEPLOYMENT }} --cluster-ref {{ .CLUSTER_REF }} \
            --num-consensus-nodes {{ .NETWORK_SIZE }}
      - cmd: $SOLO_COMMAND keys consensus generate --gossip-keys --tls-keys --deployment {{ .DEPLOYMENT }} --node-aliases {{ .NODE_ALIASES }}
      # The block node must be deployed before the consensus network.
      - cmd: $SOLO_COMMAND block node add --deployment {{ .DEPLOYMENT }} --quiet-mode --dev
      - cmd: |
          $SOLO_COMMAND consensus network deploy --deployment {{ .DEPLOYMENT }} --node-aliases {{ .NODE_ALIASES }} \
            --pvcs true --quiet-mode --dev
      - cmd: $SOLO_COMMAND consensus node setup --deployment {{ .DEPLOYMENT }} --node-aliases {{ .NODE_ALIASES }}
      - cmd: $SOLO_COMMAND consensus node start --deployment {{ .DEPLOYMENT }} --node-aliases {{ .NODE_ALIASES }}
      # Solo's backup/restore only supports a mirror node backed by an external database: the in-cluster
      # database gets new generated passwords on restore that no longer match the restored secrets.
      - task: deploy-external-database
      - cmd: |
          $SOLO_COMMAND mirror node add --deployment {{ .DEPLOYMENT }} --use-external-database --enable-ingress \
            --external-database-host {{ .POSTGRES_HOST_FQDN }} \
            --external-database-owner-username {{ .POSTGRES_USERNAME }} --external-database-owner-password {{ .POSTGRES_PASSWORD }} \
            --external-database-read-username {{ .POSTGRES_READONLY_USERNAME }} \
            --external-database-read-password {{ .POSTGRES_READONLY_PASSWORD }} \
            --pinger --quiet-mode --dev
      - cmd: $SOLO_COMMAND relay node add --deployment {{ .DEPLOYMENT }} --node-aliases {{ .NODE_ALIASES }} --quiet-mode --dev
      - cmd: $SOLO_COMMAND explorer node add --deployment {{ .DEPLOYMENT }} --enable-ingress --quiet-mode --dev
      # One-shot pre-creates the accounts hardhat.config.ts signs with; a manual deployment has to
      # create them. Alias accounts keyed by the config's first two private keys are funded here.
      - cmd: |
          for key in {{ .HARDHAT_ACCOUNT_KEYS }}; do
            $SOLO_COMMAND ledger account create --deployment {{ .DEPLOYMENT }} \
              --ecdsa-private-key "${key}" --set-alias --hbar-amount 1000
          done

  # ==================== External Database ====================

  deploy-external-database:
    desc: Deploy and initialize the external PostgreSQL database in the Kind cluster
    cmds:
      - cmd: |
          helm repo add postgresql-helm https://leverages.github.io/helm 2>/dev/null || true
          helm upgrade --install {{ .POSTGRES_NAME }} postgresql-helm/postgresql \
            --kube-context {{ .CONTEXT }} \
            --set deploymentType=local \
            --namespace {{ .POSTGRES_DATABASE_NAMESPACE }} --create-namespace \
            --set postgresql.auth.password={{ .POSTGRES_PASSWORD }}
      - cmd: |
          # The pod may not exist yet right after helm returns; wait for it to be created first.
          kubectl wait --for=create pod/{{ .POSTGRES_CONTAINER_NAME }} \
            -n {{ .POSTGRES_DATABASE_NAMESPACE }} --timeout=120s --context {{ .CONTEXT }}
          kubectl wait --for=condition=ready pod/{{ .POSTGRES_CONTAINER_NAME }} \
            -n {{ .POSTGRES_DATABASE_NAMESPACE }} --timeout=300s --context {{ .CONTEXT }}
      - cmd: |
          kubectl --context {{ .CONTEXT }} cp {{ .TASKFILE_DIR }}/scripts/init.sh \
            {{ .POSTGRES_CONTAINER_NAME }}:/tmp/init.sh -n {{ .POSTGRES_DATABASE_NAMESPACE }}
          kubectl --context {{ .CONTEXT }} exec -i {{ .POSTGRES_CONTAINER_NAME }} \
            -n {{ .POSTGRES_DATABASE_NAMESPACE }} -- chmod +x /tmp/init.sh
          kubectl --context {{ .CONTEXT }} exec -i {{ .POSTGRES_CONTAINER_NAME }} \
            -n {{ .POSTGRES_DATABASE_NAMESPACE }} \
            -- /bin/bash /tmp/init.sh "{{ .POSTGRES_USERNAME }}" "{{ .POSTGRES_READONLY_USERNAME }}" "{{ .POSTGRES_READONLY_PASSWORD }}"

  restore-db:
    desc: Restore the external database dump from the backup (before restore-network)
    cmds:
      - cmd: $SOLO_COMMAND config ops restore-db --input-dir {{ .BACKUP_DIR }}
      # A relay started against an empty mirror database never becomes ready, which would hide a
      # failed database restore, so fail early here.
      - cmd: |
          RECORD_FILE_COUNT="$(kubectl exec {{ .POSTGRES_CONTAINER_NAME }} -n {{ .POSTGRES_DATABASE_NAMESPACE }} \
            --context {{ .CONTEXT }} -- env PGPASSWORD={{ .POSTGRES_PASSWORD }} \
            psql -U {{ .POSTGRES_USERNAME }} -d {{ .POSTGRES_MIRROR_NODE_DATABASE_NAME }} -tAc \
            'SELECT COUNT(*) FROM record_file;' 2>/dev/null || true)"
          if ! echo "${RECORD_FILE_COUNT}" | grep -Eq '^[1-9][0-9]*$'; then
            echo "Mirror database restore produced no record files (count='${RECORD_FILE_COUNT}')."
            exit 1
          fi
          echo "Mirror database restore verified (${RECORD_FILE_COUNT} record files)."

  # ==================== Hardhat ====================

  pre-backup-test:
    desc: Deploy a contract and store a value, recording its address for the post-restore check
    cmds:
      - cmd: |
          cd {{ .HARDHAT_DIR }}
          npm install
          npx hardhat compile
          npx hardhat test test/pre-backup.ts --network {{ .HARDHAT_NETWORK }}

  post-restore-test:
    desc: Verify the contract and its value survived the restore, then send a new transaction
    cmds:
      - cmd: |
          cd {{ .HARDHAT_DIR }}
          npx hardhat test test/post-restore.ts --network {{ .HARDHAT_NETWORK }}

  # ==================== Backup / Reset / Restore ====================

  backup:
    desc: Freeze the network and back up ConfigMaps, Secrets, logs and consensus state
    cmds:
      # The platform does not sign the freeze state, so the backup falls back to the newest fully signed
      # periodic snapshot (state.saveStatePeriod is 60s). Wait long enough for a snapshot taken after the
      # last transaction to be written and signed; otherwise the restored ledger is older than the
      # mirror database and the first post-restore transaction fails with WRONG_NONCE.
      - cmd: sleep {{ .STATE_SNAPSHOT_WAIT_SECONDS }}
      # Freezing guarantees no further transactions change the state while it is saved.
      - cmd: $SOLO_COMMAND consensus network freeze --deployment {{ .DEPLOYMENT }}
      - cmd: |
          $SOLO_COMMAND config ops backup --deployment {{ .DEPLOYMENT }} \
            --output-dir {{ .BACKUP_DIR }} \
            --backup-external-database \
            --external-db-params-file {{ .EXTERNAL_DB_PARAMS_FILE }} \
            --zip-password {{ .ZIP_PASSWORD }} --zip-file {{ .ZIP_FILE }}
      - cmd: ls -lh {{ .BACKUP_DIR }}

  reset:
    desc: Delete every Kind cluster and the local Solo configuration, simulating a lost environment
    cmds:
      - cmd: for cluster in $(kind get clusters); do kind delete cluster --name "$cluster"; done
      - cmd: rm -f ~/.solo/local-config.yaml

  restore:
    desc: Recreate the cluster and network from the backup and restart the consensus node
    cmds:
      - task: restore-clusters
      - task: deploy-external-database
      - task: restore-db
      - task: restore-network
      - task: restore-config
      - task: restart

  restore-clusters:
    desc: Recreate the Kind cluster(s) recorded in the backup
    cmds:
      - cmd: |
          $TIMEOUT_COMMAND 700s $SOLO_COMMAND config ops restore-clusters \
            --input-dir {{ .BACKUP_DIR }} \
            --zip-password {{ .ZIP_PASSWORD }} --zip-file {{ .ZIP_FILE }}

  restore-network:
    desc: Deploy consensus, block node, mirror node, explorer and relay from the backup (DB already populated by restore-db)
    env:
      DEPLOYMENT: "{{ .DEPLOYMENT }}"
      NODE_ALIASES: "{{ .NODE_ALIASES }}"
      POSTGRES_HOST_FQDN: "{{ .POSTGRES_HOST_FQDN }}"
      POSTGRES_USERNAME: "{{ .POSTGRES_USERNAME }}"
      POSTGRES_PASSWORD: "{{ .POSTGRES_PASSWORD }}"
      POSTGRES_READONLY_USERNAME: "{{ .POSTGRES_READONLY_USERNAME }}"
      POSTGRES_READONLY_PASSWORD: "{{ .POSTGRES_READONLY_PASSWORD }}"
    cmds:
      # Single cluster, so there are no pinned LoadBalancer IPs to track.
      - cmd: |
          BLOCK_STREAM_WRITER_MODE=FILE $SOLO_COMMAND config ops restore-network \
            --input-dir {{ .BACKUP_DIR }} \
            --options-file {{ .TASKFILE_DIR }}/command.yaml \
            --skip-ip-tracking

  restore-config:
    desc: Restore ConfigMaps, Secrets and consensus node state from the backup
    cmds:
      - cmd: |
          BLOCK_STREAM_WRITER_MODE=FILE $SOLO_COMMAND config ops restore-config \
            --deployment {{ .DEPLOYMENT }} \
            --input-dir {{ .BACKUP_DIR }} \
            --external-db-params-file {{ .EXTERNAL_DB_PARAMS_FILE }}

  restart:
    desc: Start the consensus nodes from the restored state and refresh port-forwards
    cmds:
      # --skip-grpc-web-endpoint / --resume-from-freeze: see examples/multicluster-backup-restore.
      - cmd: |
          $TIMEOUT_COMMAND 300s $SOLO_COMMAND consensus node start --deployment {{ .DEPLOYMENT }} \
            --state-file {{ .BACKUP_DIR }} --skip-grpc-web-endpoint --resume-from-freeze
      - cmd: $SOLO_COMMAND deployment refresh port-forwards --deployment {{ .DEPLOYMENT }}
      # Restore/re-keying can leave a gap between the last backed-up record file and the first live
      # block; bridge it so the mirror importer resumes.
      - cmd: |
          $SOLO_COMMAND config ops bridge-import-gap --deployment {{ .DEPLOYMENT }} \
            --external-db-params-file {{ .EXTERNAL_DB_PARAMS_FILE }}

  # ==================== Cleanup ====================

  destroy:
    desc: Delete the Kind cluster and remove the backup
    cmds:
      - cmd: kind delete cluster -n {{ .CLUSTER_NAME }} || true
      - cmd: rm -rf {{ .BACKUP_DIR }} {{ .HARDHAT_DIR }}/.deployed-address
