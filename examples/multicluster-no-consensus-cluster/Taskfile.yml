version: 3

env:
  SOLO_COMMAND:
    sh: |
      if [ "${USE_RELEASED_VERSION}" = "true" ]; then
        echo "npx @hashgraph/solo"
      else
        echo "npm run solo --"
      fi

vars:
  SOLO_NAMESPACE: 'mc-no-consensus-ns'
  SOLO_DEPLOYMENT: 'mc-no-consensus-deployment'
  CLUSTER_NAME_1: 'mc-no-consensus-c1'
  CLUSTER_NAME_2: 'mc-no-consensus-c2'
  CLUSTER_REF_1: 'mc-no-consensus-c1-ref'
  CLUSTER_REF_2: 'mc-no-consensus-c2-ref'
  KIND_NODE_IMAGE: 'kindest/node:v1.31.4@sha256:2cb39f7295fe7eafee0842b1052a599a4fb0f8bcf3f83d96c7f4864c357c6c30'

  # Static LoadBalancer IPs (served by MetalLB, see metallb-cluster-1.yaml). Only cluster 1 hosts a
  # consensus node, so only node1 needs addresses.
  HAPROXY_IPS: 'node1=172.19.1.0'
  ENVOY_IPS: 'node1=172.19.1.2'
  NETWORK_NODE_IPS: 'node1=172.19.1.1'

  # Static LoadBalancer IPs of the block nodes. Each cluster's CoreDNS resolves the other cluster's block
  # node service name to this address, so pods in one cluster can reach a block node in the other.
  BLOCK_NODE_1_IP: '172.19.1.10'
  BLOCK_NODE_2_IP: '172.19.2.10'
  DNS_DOMAIN: 'cluster.local'

  CN_VERSION:
    sh: echo "${CONSENSUS_NODE_VERSION:-$(awk -F"'" '/^export const HEDERA_PLATFORM_VERSION/ {print $(NF-1); exit}' ../../version.ts)}"

tasks:
  deploy:
    desc: Create two Kind clusters, a one-node network in cluster 1 only, and a block node and mirror node in each cluster
    cmds:
      - cmd: |
          if [ "${USE_RELEASED_VERSION}" = "true" ]; then
            npm i @hashgraph/solo@latest
          fi

      - cmd: |
          kind delete cluster -n {{.CLUSTER_NAME_1}} 2>/dev/null || true
          kind delete cluster -n {{.CLUSTER_NAME_2}} 2>/dev/null || true
          docker network rm -f kind 2>/dev/null || true
          docker network create kind --scope local --subnet 172.19.0.0/16 --driver bridge
          helm repo add metallb https://metallb.github.io/metallb

      - cmd: |
          kind create cluster -n {{.CLUSTER_NAME_1}} --image {{.KIND_NODE_IMAGE}} --config {{.TASKFILE_DIR}}/kind-cluster-1.yaml &
          kind create cluster -n {{.CLUSTER_NAME_2}} --image {{.KIND_NODE_IMAGE}} --config {{.TASKFILE_DIR}}/kind-cluster-2.yaml &
          wait

      - cmd: |
          (helm upgrade --install metallb metallb/metallb \
            --kube-context kind-{{.CLUSTER_NAME_1}} \
            --namespace metallb-system --create-namespace --atomic --wait \
            --version 0.15.3 --set speaker.frr.enabled=true && \
           kubectl apply -f {{.TASKFILE_DIR}}/metallb-cluster-1.yaml --context kind-{{.CLUSTER_NAME_1}}) &
          (helm upgrade --install metallb metallb/metallb \
            --kube-context kind-{{.CLUSTER_NAME_2}} \
            --namespace metallb-system --create-namespace --atomic --wait \
            --version 0.15.3 --set speaker.frr.enabled=true && \
           kubectl apply -f {{.TASKFILE_DIR}}/metallb-cluster-2.yaml --context kind-{{.CLUSTER_NAME_2}}) &
          wait

      # cluster-ref config setup acts on the current kubectl context, so select each cluster first.
      - cmd: |
          kubectl config use-context kind-{{.CLUSTER_NAME_1}}
          $SOLO_COMMAND cluster-ref config setup -s solo-setup --quiet-mode --dev
          $SOLO_COMMAND cluster-ref config connect --cluster-ref {{.CLUSTER_REF_1}} --context kind-{{.CLUSTER_NAME_1}} --dev
          kubectl config use-context kind-{{.CLUSTER_NAME_2}}
          $SOLO_COMMAND cluster-ref config setup -s solo-setup --quiet-mode --dev
          $SOLO_COMMAND cluster-ref config connect --cluster-ref {{.CLUSTER_REF_2}} --context kind-{{.CLUSTER_NAME_2}} --dev
          kubectl config use-context kind-{{.CLUSTER_NAME_1}}

      - cmd: |
          $SOLO_COMMAND deployment config create -n {{.SOLO_NAMESPACE}} --deployment {{.SOLO_DEPLOYMENT}} --dev

      # The consensus node lives only in cluster 1. Cluster 2 is attached with zero consensus nodes
      # (https://github.com/hiero-ledger/solo/issues/3310) so that it can host only a block node and
      # a mirror node.
      - cmd: |
          $SOLO_COMMAND deployment cluster attach --deployment {{.SOLO_DEPLOYMENT}} --cluster-ref {{.CLUSTER_REF_1}} --num-consensus-nodes 1 --dev
          $SOLO_COMMAND deployment cluster attach --deployment {{.SOLO_DEPLOYMENT}} --cluster-ref {{.CLUSTER_REF_2}} --num-consensus-nodes 0 --dev

      - cmd: |
          $SOLO_COMMAND keys consensus generate --gossip-keys --tls-keys --node-aliases node1 --deployment {{.SOLO_DEPLOYMENT}} --quiet-mode --dev

      # block-node-1 (cluster 1) is node1's primary. block-node-2 (cluster 2) is listed as node1's
      # secondary, so node1's block-nodes.json points at a block node in the other cluster: the
      # address is block-node-2.<namespace>.svc.<cluster 2 dns base domain>. Sequential: both
      # commands take the Solo distributed lock.
      - cmd: |
          $SOLO_COMMAND block node add --deployment {{.SOLO_DEPLOYMENT}} --cluster-ref {{.CLUSTER_REF_1}} \
            --priority-mapping node1=1 --values-file {{.TASKFILE_DIR}}/block-node-1-values.yaml --quiet-mode --dev
          $SOLO_COMMAND block node add --deployment {{.SOLO_DEPLOYMENT}} --cluster-ref {{.CLUSTER_REF_2}} \
            --priority-mapping node1=2 --values-file {{.TASKFILE_DIR}}/block-node-2-values.yaml --quiet-mode --dev

      - task: link-clusters

      - cmd: |
          $SOLO_COMMAND consensus network deploy --deployment {{.SOLO_DEPLOYMENT}} --release-tag {{.CN_VERSION}} --quiet-mode --dev \
            --load-balancer --pvcs --haproxy-ips {{.HAPROXY_IPS}} --envoy-ips {{.ENVOY_IPS}} --network-node-ips {{.NETWORK_NODE_IPS}}
          $SOLO_COMMAND consensus node setup --deployment {{.SOLO_DEPLOYMENT}} --release-tag {{.CN_VERSION}} --quiet-mode --dev
          $SOLO_COMMAND consensus node start --deployment {{.SOLO_DEPLOYMENT}} --dev

      # One mirror node per cluster. Run sequentially: each command takes the Solo distributed lock.
      # Both import the block stream from the block node in their own cluster, so a transaction only
      # shows up in a mirror node if it travelled consensus node -> block node -> mirror node.
      - cmd: |
          $SOLO_COMMAND mirror node add --deployment {{.SOLO_DEPLOYMENT}} --cluster-ref {{.CLUSTER_REF_1}} \
            --mirror-node-source block-node \
            --values-file {{.TASKFILE_DIR}}/mirror-memory-values.yaml --quiet-mode --dev
          $SOLO_COMMAND mirror node add --deployment {{.SOLO_DEPLOYMENT}} --cluster-ref {{.CLUSTER_REF_2}} \
            --mirror-node-source block-node \
            --values-file {{.TASKFILE_DIR}}/mirror-memory-values.yaml --quiet-mode --dev

      - task: verify

  verify:
    desc: Verify cluster 2 has no consensus node, the components are Ready, node1 reaches the cluster 2 block node, and a new account reaches both mirror nodes
    cmds:
      # cluster 2 must be attached to the deployment and hold no consensus node pods
      - cmd: |
          CONFIG="$(kubectl --context kind-{{.CLUSTER_NAME_1}} get configmap solo-remote-config -n {{.SOLO_NAMESPACE}} \
            -o jsonpath='{.data.remote-config-data}')"
          echo "${CONFIG}" | grep -q "{{.CLUSTER_REF_2}}" || { echo "ERROR: cluster 2 is not in the remote config" >&2; exit 1; }
          if kubectl --context kind-{{.CLUSTER_NAME_2}} get pods -n {{.SOLO_NAMESPACE}} -o name | grep -q "network-node"; then
            echo "ERROR: cluster 2 unexpectedly runs a consensus node" >&2
            exit 1
          fi
          echo "OK: cluster 2 is attached and has no consensus node pods"

      - cmd: |
          check_ready() {
            if ! kubectl --context "kind-$1" wait --for=condition=Ready pods --all -n {{.SOLO_NAMESPACE}} \
              -l "app.kubernetes.io/instance=$2" --timeout=15m; then
              echo "ERROR: pods of $2 in cluster $1 did not become Ready" >&2
              kubectl --context "kind-$1" get pods -n {{.SOLO_NAMESPACE}} -o wide
              exit 1
            fi
          }
          check_ready {{.CLUSTER_NAME_1}} block-node-1
          check_ready {{.CLUSTER_NAME_1}} mirror-1
          check_ready {{.CLUSTER_NAME_2}} block-node-2
          check_ready {{.CLUSTER_NAME_2}} mirror-2

      # node1 (cluster 1) must be able to reach block-node-2 in cluster 2 by its service name
      - cmd: |
          POD="$(kubectl --context kind-{{.CLUSTER_NAME_1}} get pods -n {{.SOLO_NAMESPACE}} -o name | grep network-node1 | head -1)"
          FQDN="block-node-2.{{.SOLO_NAMESPACE}}.svc.{{.DNS_DOMAIN}}"
          kubectl --context kind-{{.CLUSTER_NAME_1}} exec -n {{.SOLO_NAMESPACE}} "${POD}" -c root-container -- getent hosts "${FQDN}" \
            || { echo "ERROR: node1 cannot resolve ${FQDN}" >&2; exit 1; }
          kubectl --context kind-{{.CLUSTER_NAME_1}} exec -n {{.SOLO_NAMESPACE}} "${POD}" -c root-container -- \
            timeout 10 bash -c "</dev/tcp/${FQDN}/40840" \
            || { echo "ERROR: node1 cannot open a connection to ${FQDN}:40840" >&2; exit 1; }
          echo "OK: node1 reaches ${FQDN}:40840"

      # A transaction must reach the mirror node of every cluster (consensus node -> block node -> mirror node)
      - cmd: |
          OUTPUT="$($SOLO_COMMAND ledger account create --deployment {{.SOLO_DEPLOYMENT}} --hbar-amount 100 --create-amount 1 --dev)"
          echo "${OUTPUT}"
          ACCOUNT_ID="$(echo "${OUTPUT}" | grep -o '"accountId": "[^"]*"' | head -n 1 | sed 's/"accountId": "\(.*\)"/\1/')"
          [ -n "${ACCOUNT_ID}" ] || { echo "ERROR: accountId not found in output" >&2; exit 1; }
          echo "Created account ${ACCOUNT_ID}"
          for entry in "{{.CLUSTER_NAME_1}} mirror-1-rest" "{{.CLUSTER_NAME_2}} mirror-2-rest"; do
            set -- ${entry}
            found=false
            for attempt in $(seq 1 60); do
              RESPONSE="$(kubectl --context "kind-$1" get --raw \
                "/api/v1/namespaces/{{.SOLO_NAMESPACE}}/services/$2:80/proxy/api/v1/accounts/${ACCOUNT_ID}" 2>/dev/null || true)"
              if echo "${RESPONSE}" | grep -q "\"account\":\"${ACCOUNT_ID}\""; then
                echo "OK: ${ACCOUNT_ID} found in $2 (cluster $1)"
                found=true
                break
              fi
              sleep 5
            done
            if [ "${found}" != "true" ]; then
              echo "ERROR: ${ACCOUNT_ID} not found in $2 (cluster $1) after 5 minutes" >&2
              exit 1
            fi
          done

  # Each cluster's CoreDNS resolves the other cluster's block node service name to its static
  # LoadBalancer IP. Solo writes that name into node1's block-nodes.json (and into block node
  # backfill sources), but nothing resolves it across clusters by default.
  link-clusters:
    desc: Make each cluster resolve the other cluster's block node service name to its LoadBalancer IP
    cmds:
      - cmd: |
          link() {
            cluster="$1"; name="$2"; ip="$3"
            fqdn="${name}.{{.SOLO_NAMESPACE}}.svc.{{.DNS_DOMAIN}}"
            COREFILE="$(kubectl --context "kind-${cluster}" get configmap coredns -n kube-system -o jsonpath='{.data.Corefile}')"
            if echo "${COREFILE}" | grep -q "${fqdn}"; then
              return
            fi
            NEW="$(echo "${COREFILE}" | awk -v ip="${ip}" -v fqdn="${fqdn}" '
              /^[[:space:]]*kubernetes / { print "    hosts {"; print "        " ip " " fqdn; print "        fallthrough"; print "    }" }
              { print }')"
            kubectl --context "kind-${cluster}" create configmap coredns -n kube-system \
              --from-literal="Corefile=${NEW}" --dry-run=client -o yaml | kubectl --context "kind-${cluster}" apply -f -
            kubectl --context "kind-${cluster}" rollout restart deployment coredns -n kube-system
            kubectl --context "kind-${cluster}" rollout status deployment coredns -n kube-system --timeout=120s
          }
          link {{.CLUSTER_NAME_1}} block-node-2 {{.BLOCK_NODE_2_IP}}
          link {{.CLUSTER_NAME_2}} block-node-1 {{.BLOCK_NODE_1_IP}}

  destroy:
    desc: Destroy the Solo network and both Kind clusters
    cmds:
      - cmd: |
          $SOLO_COMMAND mirror node destroy --deployment {{.SOLO_DEPLOYMENT}} --cluster-ref {{.CLUSTER_REF_1}} --force --dev
          $SOLO_COMMAND mirror node destroy --deployment {{.SOLO_DEPLOYMENT}} --cluster-ref {{.CLUSTER_REF_2}} --force --dev
          $SOLO_COMMAND block node destroy --deployment {{.SOLO_DEPLOYMENT}} --cluster-ref {{.CLUSTER_REF_1}} --force --dev
          $SOLO_COMMAND block node destroy --deployment {{.SOLO_DEPLOYMENT}} --cluster-ref {{.CLUSTER_REF_2}} --force --dev
          $SOLO_COMMAND consensus network destroy --deployment {{.SOLO_DEPLOYMENT}} --force --dev --delete-pvcs --delete-secrets -q
      - cmd: |
          kind delete cluster -n {{.CLUSTER_NAME_1}}
          kind delete cluster -n {{.CLUSTER_NAME_2}}
          docker network rm -f kind 2>/dev/null || true

  default:
    desc: Run the complete deploy + verify workflow
    cmds:
      - task: deploy
