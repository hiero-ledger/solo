# Foundry configuration for testing contracts against a local Solo one-shot deployment.
# Every option is documented at https://getfoundry.sh/config/reference/

[profile.default]
# Use the Hardhat project layout; contracts/SimpleStorage.sol is a copy of the hardhat-with-solo contract.
src = "contracts"
test = "test"
out = "out"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/"]

# Same compiler as the hardhat-with-solo example. Pin the EVM version to the solc 0.8.28 default so a
# newer Foundry default cannot change the generated bytecode.
solc_version = "0.8.28"
evm_version = "cancun"

# `forge test` forks the JSON-RPC relay that `solo one-shot single deploy` port-forwards to localhost:37546,
# so tests run against live Solo state (chain id 298) instead of an empty local EVM.
eth_rpc_url = "http://localhost:37546"

# A Solo network is ephemeral and its block numbers restart on every redeploy, so never reuse cached fork state.
no_storage_caching = true
